schema_version = 1

[[provider]]
id = "linux-thermal"
class = "generic"
observation = ["/sys/class/thermal/thermal_zone*/type", "/sys/class/thermal/thermal_zone*/temp", "/sys/class/thermal/thermal_zone*/trip_point_*_temp", "/sys/class/thermal/thermal_zone*/trip_point_*_type"]

[[provider]]
id = "qualcomm-thermal"
class = "vendor"
patterns = ["qcom", "msm", "tsens", "pmic"]

[[provider]]
id = "mediatek-thermal"
class = "vendor"
patterns = ["mtk", "mt6", "mt7", "mt8", "mt9", "lvts"]

[[provider]]
id = "exynos-thermal"
class = "vendor"
patterns = ["exynos", "s5e"]

[[provider]]
id = "tensor-thermal"
class = "vendor"
patterns = ["tensor", "gs", "g3", "g4", "g5"]

[authority]
source = "runtime-thermal-trip-topology"
thresholds = "runtime-derived"
static_database_role = "evidence-and-provider-hints-only"
missing_telemetry = "limited-performance-envelope"
