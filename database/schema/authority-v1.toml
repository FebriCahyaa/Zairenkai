schema_version = 1
name = "zairenkai-authority"

# Permission names are stable semantic contracts. Implementations may expose
# only the subset available on a given kernel/device.
permissions = [
  "read.device",
  "read.kernel",
  "read.thermal",
  "read.performance",
  "read.logs",
  "tune.cpu",
  "tune.gpu",
  "tune.memory",
  "tune.io",
  "tune.power",
  "tune.thermal",
  "security.license",
  "security.policy",
  "control.hooks",
  "control.reset",
  "experimental",
]

[principles]
default = "deny"
unknown_capability = "deny"
unsafe_fallback = "deny"
root_boundary = "kernel-enforced-and-runtime-checked"
