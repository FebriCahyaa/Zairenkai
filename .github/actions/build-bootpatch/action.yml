name: Build standalone boot-patch backend
description: Test and cross-compile the standalone GPL boot-image patcher for Android ABIs; do not package the legacy PID-1 adapter.
runs:
  using: composite
  steps:
    - name: Set up pinned Rust 1.99.1 for Android ABIs
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install 1.99.1 --profile minimal
        rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.99.1

    - name: Install locked cargo-ndk
      shell: bash
      run: cargo +1.99.1 install cargo-ndk --locked

    - name: Test boot-patch backend with the committed lockfile
      shell: bash
      run: cargo +1.99.1 test --locked --manifest-path native/bootpatch/Cargo.toml

    - name: Build helper for Android
      shell: bash
      run: |
        set -euo pipefail
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
        tools/bootpatch/build-android.sh
