name: Build standalone boot-patch backend
description: Test and cross-compile the separately licensed GPL boot-image patcher and init adapter for Android ABIs.
runs:
  using: composite
  steps:
    - name: Set up Rust for Android ABIs
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,x86_64-linux-android

    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --locked

    - name: Test boot-patch backend
      shell: bash
      run: cargo test --manifest-path native/bootpatch/Cargo.toml

    - name: Build helper for Android
      shell: bash
      run: |
        set -euo pipefail
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
        tools/bootpatch/build-android.sh
