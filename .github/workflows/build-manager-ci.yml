# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
# Commit/PR CI validates the full KMI matrix and builds only Canary Standard/Spoof APKs.
# Stable Release signing, automatic tag creation, and GitHub Release publication are
# intentionally isolated in release.yml and can only start from Actions -> workflow_dispatch.
# This workflow uploads Actions artifacts only; it never publishes a GitHub Release.
name: Build Manager CI

on:
  push:
    branches: [main, ccr-076d8b15-osiupp]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "module/**"
      - "rust/**"
      - "rust-toolchain.toml"
      - "kernel/**"
      - "userspace/**"
      - "native/bootpatch/**"
      - "tools/**"
      - "tests/**"
      - "database/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main, ccr-076d8b15-osiupp]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "module/**"
      - "rust/**"
      - "rust-toolchain.toml"
      - "kernel/**"
      - "userspace/**"
      - "native/bootpatch/**"
      - "tools/**"
      - "tests/**"
      - "database/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-manager-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests, R8 and lint
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read

  native:
    name: Native crypto, UAPI, userspace, Rust and module compile
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  atlas:
    name: Atlas and device registry validation
    uses: ./.github/workflows/atlas.yml
    permissions:
      contents: read

  rustfmt:
    name: Rust formatting
    uses: ./.github/workflows/rustfmt.yml
    permissions:
      contents: read

  clippy:
    name: Rust Clippy
    uses: ./.github/workflows/clippy.yml
    permissions:
      contents: read

  shellcheck:
    name: Shell script analysis
    uses: ./.github/workflows/shellcheck.yml
    permissions:
      contents: read

  workflow-contracts:
    name: CI workflow contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify orchestration, matrix, signing, changelog and server contracts
        run: |
          set -euo pipefail
          python3 tools/ci/test-build-manager-workflow.py
          python3 tools/ci/test-bootpatch-kmi-kernelsu-next.py
          python3 tools/ci/test-generate-changelog.py
          python3 tools/ci/test-smoke-license-server.py
          python3 tools/ci/test-smoke-update-server.py
          python3 tools/ci/test-module-payload-manifest.py --self-test
          python3 tools/ci/test-owner-key-provisioning.py
          python3 tools/ci/test_release_manifest.py
          python3 tools/ci/generate-spoof-package-id.py | grep -Eq '^[a-z]{6}(\.[a-z]{6}){2}$'

  # The full KMI matrix is still exercised on commit/PR, but automatic CI packages
  # only the Canary module. The Release-channel package is produced by manual release.yml.
  module:
    name: Full KMI matrix + Canary module package
    uses: ./.github/workflows/build-module.yml
    with:
      channel: canary
      ddk_release: "20260828"
      server_url: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
    permissions:
      contents: read

  # KernelSU-Next-style Canary matrix: one independent job per APK flavor.
  # The stable Release matrix is exclusively in the manually-dispatched release.yml.
  build-manager:
    name: Canary / ${{ matrix.variant }} APK
    needs: [module]
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, spoof]
    uses: ./.github/workflows/build-manager.yml
    with:
      channel: canary
      variant: ${{ matrix.variant }}
      require_signing: ${{ github.event_name != 'pull_request' }}
      license_server_url: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
    secrets:
      ZK_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ZK_KEYSTORE_BASE64 || '' }}
      ZK_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ZK_KEYSTORE_PASSWORD || '' }}
      ZK_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ZK_KEY_ALIAS || '' }}
      ZK_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ZK_KEY_PASSWORD || '' }}
    permissions:
      contents: read

  summary:
    name: Build Manager CI summary
    if: ${{ always() }}
    needs: [android, native, atlas, rustfmt, clippy, shellcheck, workflow-contracts, module, build-manager]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Write pipeline summary
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          ATLAS_RESULT: ${{ needs.atlas.result }}
          RUSTFMT_RESULT: ${{ needs.rustfmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          WORKFLOW_CONTRACTS_RESULT: ${{ needs.workflow-contracts.result }}
          MODULE_RESULT: ${{ needs.module.result }}
          MANAGER_RESULT: ${{ needs.build-manager.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "# Zairenkai Build Manager CI"
            echo
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Android tests, R8 and lint | ${ANDROID_RESULT} |"
            echo "| Native crypto/UAPI/userspace/Rust/module checks | ${NATIVE_RESULT} |"
            echo "| Atlas registry and device data | ${ATLAS_RESULT} |"
            echo "| Rustfmt | ${RUSTFMT_RESULT} |"
            echo "| Clippy | ${CLIPPY_RESULT} |"
            echo "| ShellCheck | ${SHELLCHECK_RESULT} |"
            echo "| Workflow contracts | ${WORKFLOW_CONTRACTS_RESULT} |"
            echo "| Full KMI matrix + Canary module package | ${MODULE_RESULT} |"
            echo "| APK matrix: Canary × Standard/Spoof | ${MANAGER_RESULT} |"
            echo
            if [[ "$EVENT_NAME" == pull_request ]]; then
              echo "PR policy: two optimized Canary APK variants are compiled as unsigned validation artifacts; signing secrets are not forwarded to the build matrix."
            else
              echo "Push/manual policy: Canary Standard and Spoof are signed and uploaded as Actions artifacts; stable Release publication is manual-only in release.yml."
            fi
            echo "This workflow uploads Actions artifacts only. It never publishes GitHub Release assets or creates stable tags."
            echo "Run Actions -> Release manually for a full signed stable build; that workflow creates the vX.Y.Z tag and GitHub Release after validation."
          } >> "$GITHUB_STEP_SUMMARY"
