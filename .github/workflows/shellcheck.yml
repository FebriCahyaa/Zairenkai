name: ShellCheck

on:
  push:
    branches: [main, ccr-076d8b15-osiupp]
    paths:
      - 'module/**/*.sh'
      - 'module/*.sh'
      - 'tools/bootpatch/**/*.sh'
      - 'tools/bootpatch/*.sh'
      - 'tools/ci/**/*.sh'
      - 'tools/ci/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main, ccr-076d8b15-osiupp]
    paths:
      - 'module/**/*.sh'
      - 'module/*.sh'
      - 'tools/bootpatch/**/*.sh'
      - 'tools/bootpatch/*.sh'
      - 'tools/ci/**/*.sh'
      - 'tools/ci/*.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck

      - name: Check distribution scripts for shell errors
        run: |
          set -euo pipefail
          find module tools/bootpatch tools/ci -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -S error
