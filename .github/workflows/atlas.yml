name: Atlas data validation

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Atlas registry and source boundaries
        run: bash tests/atlas_check.sh
