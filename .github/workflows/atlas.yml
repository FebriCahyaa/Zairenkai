name: Atlas data validation

on:
  push:
    branches: [main]
    paths:
      - "database/**"
      - "tools/atlas_validate.py"
      - "tests/atlas_check.sh"
      - ".github/workflows/atlas.yml"
  pull_request:
    paths:
      - "database/**"
      - "tools/atlas_validate.py"
      - "tests/atlas_check.sh"
      - ".github/workflows/atlas.yml"
  workflow_dispatch:

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Atlas registry and source boundaries
        run: bash tests/atlas_check.sh
