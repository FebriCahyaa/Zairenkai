# SPDX-License-Identifier: GPL-2.0-only
# Build the ZKFC loadable kernel module for every supported KMI, the
# KernelSU-Next way (DDK container per KMI). Reusable: other workflows call it
# and then collect the per-KMI zkfc.ko artifacts.
name: Build LKM

on:
  workflow_call:
    inputs:
      ddk_release:
        description: 'ddk-min image release tag (e.g. 20260828)'
        required: false
        default: '20260828'
        type: string
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'ddk-min image release tag (e.g. 20260828)'
        required: false
        default: '20260828'
        type: string

permissions:
  contents: read

jobs:
  build-lkm-zkfc:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-zkfc.yml
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: ${{ inputs.ddk_release || '20260828' }}
