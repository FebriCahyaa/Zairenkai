name: Android app

on:
  push:
    branches: [main, ccr-076d8b15-osiupp]
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "module/**", "rust/**", "kernel/**", "userspace/**", "native/bootpatch/**", "tools/bootpatch/**", "tools/ci/**", "tools/zkfc-license/**", "tools/release/**", ".github/workflows/android.yml", ".github/workflows/app-apks.yml", ".github/workflows/build-module.yml", ".github/workflows/release.yml", ".github/actions/build-bootpatch/action.yml", "rust-toolchain.toml"]
  pull_request:
    branches: [main, ccr-076d8b15-osiupp]
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "module/**", "rust/**", "kernel/**", "userspace/**", "native/bootpatch/**", "tools/bootpatch/**", "tools/ci/**", "tools/zkfc-license/**", "tools/release/**", ".github/workflows/android.yml", ".github/workflows/app-apks.yml", ".github/workflows/build-module.yml", ".github/workflows/release.yml", ".github/actions/build-bootpatch/action.yml", "rust-toolchain.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          # The obsolete 'tools' package no longer exists; default would fail.
          packages: platform-tools

      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Build boot-patch backend
        uses: ./.github/actions/build-bootpatch

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Validate optional update server configuration
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$ZKFC_LICENSE_SERVER_URL" ]]; then
            echo "::notice::ZKFC_LICENSE_SERVER_URL is not configured. CI-only APKs will be built with the updater failing closed; distribution workflows require the variable."
          elif [[ ! "$ZKFC_LICENSE_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]]; then
            echo "::error::ZKFC_LICENSE_SERVER_URL must be an HTTPS origin with no path."
            exit 1
          fi

      # This is validation-only CI: no APK artifact is published from this workflow.
      # Distribution builds are handled by App APKs (Canary) and Release (stable).
      - name: Assemble optimized validation variants
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: ./gradlew :app:assembleStandardCanary :app:assembleStandardRelease "-PlicenseServerUrl=$ZKFC_LICENSE_SERVER_URL" --no-daemon --stacktrace

      - name: Unit tests (engine JSON contracts, tweak outcomes)
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: ./gradlew :app:test "-PlicenseServerUrl=$ZKFC_LICENSE_SERVER_URL" --no-daemon --stacktrace

      # Exercise the optimized Canary variant in CI. A non-minified build does not
      # run R8, so it cannot catch reflectively loaded crypto mappings being stripped.
      - name: Validate R8 keeps Ed25519 provider mappings
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardCanary "-PlicenseServerUrl=${{ vars.ZKFC_LICENSE_SERVER_URL }}" --no-daemon --stacktrace
          USAGE="$(find app/build/outputs/mapping -type f -name usage.txt -print | grep -i 'canary' | head -n 1 || true)"
          [[ -n "$USAGE" && -f "$USAGE" ]] || {
            echo "::error::R8 usage.txt was not produced for the minified Canary build."
            exit 1
          }
          if grep -Fq 'org.bouncycastle.jcajce.provider.asymmetric.EdEC$Mappings' "$USAGE"; then
            echo '::error::R8 stripped EdEC$Mappings required for Ed25519 verification.'
            exit 1
          fi
          echo 'PASS: EdEC$Mappings was not reported as removed by R8.'

      - name: Lint
        run: ./gradlew :app:lintStandardCanary --no-daemon --stacktrace

      # Keep the complete HTML/SARIF/text reports even when lint fails. The first
      # exception line in Gradle output often hides the remaining findings.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-standardCanary.html
            app/build/reports/lint-results-standardCanary.sarif
            app/build/reports/lint-results-standardCanary.xml
            app/build/intermediates/lint_intermediate_text_report/standardCanary/lintReportStandardCanary/lint-results-standardCanary.txt
          if-no-files-found: warn
          retention-days: 7
