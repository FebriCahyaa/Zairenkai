name: Android app

on:
  push:
    branches: [main]
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/android.yml", "userspace/**"]
  pull_request:
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "userspace/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Debug builds are auto-signed with Android's debug key — no release key
      # needed. assembleDebug builds BOTH flavors: standard and the
      # spoofed-package variant (different applicationId, for side-by-side).
      - name: Assemble debug APKs (standard + spoofed)
        run: ./gradlew :app:assembleStandardDebug :app:assembleSpoofedDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintStandardDebug --stacktrace
        continue-on-error: true

      - name: Upload standard debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zairenkai-standard-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload spoofed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zairenkai-spoofed-debug
          path: app/build/outputs/apk/spoofed/debug/*.apk
          if-no-files-found: error
