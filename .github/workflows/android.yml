name: Android app

on:
  push:
    branches: [main, ccr-076d8b15-osiupp]
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/android.yml", "userspace/**", "native/bootpatch/**", "tools/bootpatch/**", "tools/ci/**", "tools/zkfc-license/**", ".github/actions/build-bootpatch/action.yml"]
  pull_request:
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "userspace/**", "native/bootpatch/**", "tools/bootpatch/**", "tools/ci/**", "tools/zkfc-license/**", ".github/actions/build-bootpatch/action.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          # The obsolete 'tools' package no longer exists; default would fail.
          packages: platform-tools

      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Build boot-patch backend
        uses: ./.github/actions/build-bootpatch

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Validate update server configuration
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          [[ "$ZKFC_LICENSE_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || {
            echo "::error::Set ZKFC_LICENSE_SERVER_URL as a GitHub Actions variable (HTTPS origin, no path)."
            exit 1
          }

      # Distribution variants are optimized, non-debuggable Canary and Release only.
      - name: Assemble Canary and Release
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: ./gradlew :app:assembleStandardCanary :app:assembleStandardRelease "-PlicenseServerUrl=$ZKFC_LICENSE_SERVER_URL" --stacktrace

      - name: Unit tests (engine JSON contracts, tweak outcomes)
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: ./gradlew :app:testStandardCanaryUnitTest :app:testStandardReleaseUnitTest "-PlicenseServerUrl=$ZKFC_LICENSE_SERVER_URL" --stacktrace

      # Exercise the optimized Canary variant in CI. A non-minified build does not
      # run R8, so it cannot catch reflectively loaded crypto mappings being stripped.
      - name: Validate R8 keeps Ed25519 provider mappings
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardCanary "-PlicenseServerUrl=${{ vars.ZKFC_LICENSE_SERVER_URL }}" --stacktrace
          USAGE="$(find app/build/outputs/mapping -type f -name usage.txt -print -quit)"
          [[ -n "$USAGE" && -f "$USAGE" ]] || {
            echo "::error::R8 usage.txt was not produced for the minified Canary build."
            exit 1
          }
          if grep -Fq 'org.bouncycastle.jcajce.provider.asymmetric.EdEC$Mappings' "$USAGE"; then
            echo '::error::R8 stripped EdEC$Mappings required for Ed25519 verification.'
            exit 1
          fi
          echo 'PASS: EdEC$Mappings was not reported as removed by R8.'

      - name: Lint
        run: ./gradlew :app:lintStandardCanary --stacktrace

      # Keep the complete HTML/SARIF/text reports even when lint fails. The first
      # exception line in Gradle output often hides the remaining findings.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-standardCanary.html
            app/build/reports/lint-results-standardCanary.sarif
            app/build/reports/lint-results-standardCanary.xml
            app/build/intermediates/lint_intermediate_text_report/standardCanary/lintReportStandardCanary/lint-results-standardCanary.txt
          if-no-files-found: warn
          retention-days: 7
