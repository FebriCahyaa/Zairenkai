name: Android app

on:
  push:
    branches: [main, ccr-076d8b15-osiupp]
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/android.yml", "userspace/**", "native/bootpatch/**", "tools/bootpatch/**", "tools/ci/**", "tools/zkfc-license/**", ".github/actions/build-bootpatch/action.yml"]
  pull_request:
    paths: ["app/**", "gradle/**", "build.gradle.kts", "settings.gradle.kts", "userspace/**", "native/bootpatch/**", "tools/bootpatch/**", "tools/ci/**", "tools/zkfc-license/**", ".github/actions/build-bootpatch/action.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          # The obsolete 'tools' package no longer exists; default would fail.
          packages: platform-tools

      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Build boot-patch backend
        uses: ./.github/actions/build-bootpatch

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Generate randomized spoofed application ID
        id: spoofed_app_id
        run: |
          set -euo pipefail
          app_id="$(python3 tools/ci/generate-spoofed-app-id.py)"
          [[ "$app_id" =~ ^[a-z]{6}\.[a-z]{6}\.[a-z]{6}$ ]] || {
            echo "::error::Generated spoofed application ID is invalid"
            exit 1
          }
          echo "application_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "Generated a per-build-job randomized package ID for the spoofed flavor."

      # Debug builds are auto-signed with Android's debug key — no release key
      # needed. The spoofed flavor receives a fresh applicationId for this run.
      - name: Assemble debug APKs (standard + spoofed)
        run: ./gradlew :app:assembleStandardDebug :app:assembleSpoofedDebug "-PspoofedAppId=${{ steps.spoofed_app_id.outputs.application_id }}" --stacktrace

      - name: Unit tests (engine JSON contracts, tweak outcomes)
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintStandardDebug --stacktrace

      # Keep the complete HTML/SARIF/text reports even when lint fails. The first
      # exception line in Gradle output often hides the remaining findings.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-standardDebug.html
            app/build/reports/lint-results-standardDebug.sarif
            app/build/reports/lint-results-standardDebug.xml
            app/build/intermediates/lint_intermediate_text_report/standardDebug/lintReportStandardDebug/lint-results-standardDebug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload standard debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zairenkai-standard-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload spoofed debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zairenkai-spoofed-debug
          path: app/build/outputs/apk/spoofed/debug/*.apk
          if-no-files-found: error
