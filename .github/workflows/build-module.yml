# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
# Reusable: build the flashable Zairenkai module — the per-KMI kernel modules
# (zkfc.ko, built the KernelSU-Next way via DDK containers in build-lkm.yml),
# the zperfd/zkfctl userspace binaries, the zperf catalog and a checksum
# manifest — and hand it back as the `module-zip` artifact (Zairenkai-module.zip
# + SHA256SUMS). Callers add the APK and publish. This is the ".ko half" of a
# KSU-Next-style release: manager APK + kernel module, built together in CI.
name: Build module

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The .ko half: build zkfc.ko per KMI the KernelSU-Next way (DDK containers).
  lkm:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-zkfc.yml
    with:
      kmi: ${{ matrix.kmi }}

  package:
    name: Package flashable module
    needs: lkm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.99.0
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.99.0
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;30.0.16248370"

      - name: Build zperfd and validate workspace
        working-directory: rust
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android31-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android31-clang"
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            target="${t%%:*}"; abi="${t##*:}"
            cargo build -p zperfd --release --target "$target" --locked
            mkdir -p "../module/bin/$abi"
            cp "target/$target/release/zperfd" "../module/bin/$abi/zperfd"
            "$TC/llvm-strip" "../module/bin/$abi/zperfd"
          done

      - name: Build zkfctl userspace
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            triple="${t%%:*}"; abi="${t##*:}"
            mkdir -p "module/bin/$abi"
            "$TC/${triple}31-clang" -std=c11 -O2 -Wall -Wextra -Werror \
              -fstack-protector-strong -fPIE -pie \
              -I kernel/include/uapi -I userspace/include -I userspace/lib \
              userspace/lib/*.c userspace/zkfctl/main.c -o "module/bin/$abi/zkfctl"
            "$TC/llvm-strip" "module/bin/$abi/zkfctl"
          done

      - name: Stage zperf catalog
        run: |
          set -euo pipefail
          mkdir -p module/zperf/catalog
          cp rust/zperfd/profiles/*.toml module/zperf/catalog/

      - name: Download zkfc.ko artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          pattern: '*-zkfc-lkm'
          path: lkm-artifacts

      - name: Lay out .ko into module/lkm/<kmi>-<abidir>
        run: |
          set -euo pipefail
          # Artifact dirs are named "<arch>-<kmi>-zkfc-lkm" holding "<kmi>_zkfc.ko".
          # customize.sh looks for lkm/<KMI>-<ABIDIR>/zkfc.ko (ABIDIR = arm64|x86_64).
          shopt -s nullglob
          for d in lkm-artifacts/*-zkfc-lkm; do
            base=$(basename "$d")
            arch=${base%%-*}
            rest=${base#*-}; kmi=${rest%-zkfc-lkm}
            case "$arch" in
              aarch64) abidir=arm64 ;;
              x86_64)  abidir=x86_64 ;;
              *) echo "unknown arch '$arch' in $base"; continue ;;
            esac
            ko=$(find "$d" -name '*_zkfc.ko' | head -1)
            [ -f "$ko" ] || { echo "no .ko in $d"; continue; }
            mkdir -p "module/lkm/$kmi-$abidir"
            cp "$ko" "module/lkm/$kmi-$abidir/zkfc.ko"
            sha256sum "module/lkm/$kmi-$abidir/zkfc.ko" | tee "module/lkm/$kmi-$abidir/zkfc.ko.sha256"
          done

      - name: Package module + checksum manifest
        run: |
          set -euo pipefail
          test -n "$(find module/lkm -name 'zkfc.ko' -print -quit)"
          : > module/SHA256SUMS
          (cd module && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > module/SHA256SUMS
          (cd module && zip -r9 ../Zairenkai-module.zip . -x '*.git*')
          cp module/SHA256SUMS SHA256SUMS
          sha256sum Zairenkai-module.zip

      - name: Upload module artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: module-zip
          path: |
            Zairenkai-module.zip
            SHA256SUMS
          if-no-files-found: error
