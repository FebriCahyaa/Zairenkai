# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
# Reusable module build following KernelSU-Next's split build/aggregate pattern:
# one DDK job per KMI builds common binaries once; channel packaging fans out afterwards.
name: Build module

on:
  workflow_call:
    inputs:
      channel:
        description: Update channel to stamp (canary/release) or both to build both packages from one KMI matrix.
        required: false
        default: canary
        type: string
      version_name:
        description: Stable X.Y.Z version for Release; ignored for Canary.
        required: false
        default: ''
        type: string
      ddk_release:
        description: ddk-min image release tag.
        required: false
        default: '20260828'
        type: string
      server_url:
        description: License Server HTTPS origin; optional only for PR compile validation.
        required: false
        default: ''
        type: string
      allow_unpublished_release:
        description: Permit a non-published Release-channel validation package on a branch.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      channel:
        description: Module build channel
        required: true
        default: canary
        type: choice
        options:
          - canary
          - release
          - both
      version_name:
        description: Stable X.Y.Z version for Release (for example 1.1.0)
        required: false
        default: ''
        type: string
      ddk_release:
        description: ddk-min image release tag
        required: false
        default: '20260828'
        type: string
      server_url:
        description: Optional License Server HTTPS origin.
        required: false
        default: ''
        type: string
      allow_unpublished_release:
        description: Permit branch-only Release validation artifacts (never publish them).
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: module-${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel || 'canary' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate module build inputs
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version_name: ${{ steps.meta.outputs.version_name }}
      base_version: ${{ steps.meta.outputs.base_version }}
      server_url: ${{ steps.meta.outputs.server_url }}
      module_version_code: ${{ steps.meta.outputs.module_version_code }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate channel, version and update server
        id: meta
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel || 'canary' }}
          REQUESTED_VERSION: ${{ inputs.version_name || '' }}
          REQUESTED_SERVER_URL: ${{ inputs.server_url || vars.ZKFC_LICENSE_SERVER_URL }}
          ALLOW_UNPUBLISHED_RELEASE: ${{ inputs.allow_unpublished_release }}
        run: |
          set -euo pipefail
          CHANNEL="$REQUESTED_CHANNEL"
          [[ "$CHANNEL" == canary || "$CHANNEL" == release || "$CHANNEL" == both ]] || {
            echo "::error::Channel must be canary, release, or both."
            exit 1
          }
          ZKFC_LICENSE_SERVER_URL="${REQUESTED_SERVER_URL:-}"
          # Building binaries must not be skipped just because the live worker is
          # temporarily unavailable. Use an unmistakable non-routable origin when
          # not configured; Canary/Release publisher workflows perform the live
          # health + D1 check and refuse publication until the real worker is ready.
          if [[ -z "$ZKFC_LICENSE_SERVER_URL" ]]; then
            ZKFC_LICENSE_SERVER_URL="https://license-server-validation.invalid"
            echo "::notice::License Server URL not configured; generating validation-only module metadata. Publication will fail its live-server gate."
          fi
          [[ "$ZKFC_LICENSE_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || {
            echo "::error::ZKFC_LICENSE_SERVER_URL must be an HTTPS origin without a path."
            exit 1
          }

          python3 tools/ci/test-owner-key-provisioning.py
          BASE_VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$CHANNEL" == canary ]]; then
            VERSION_NAME="${BASE_VERSION}-canary.${GITHUB_RUN_NUMBER}"
            URL_TAG=canary
          else
            VERSION_NAME="${REQUESTED_VERSION#v}"
            if [[ "$ALLOW_UNPUBLISHED_RELEASE" == true && "$GITHUB_REF_TYPE" != tag ]]; then
              [[ -n "$VERSION_NAME" ]] || VERSION_NAME="$BASE_VERSION"
              [[ "$VERSION_NAME" == "$BASE_VERSION" ]] || {
                echo "::error::Unpublished Release validation version must match app versionName ($BASE_VERSION)."
                exit 1
              }
              URL_TAG="v${VERSION_NAME}"
              echo "::notice::Building a non-published Release-channel module validation artifact from branch $GITHUB_REF_NAME."
            else
              [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "::error::Release module builds must run from a stable vMAJOR.MINOR.PATCH tag."
                exit 1
              }
              [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "::error::Release version_name must be stable X.Y.Z."
                exit 1
              }
              [[ "$VERSION_NAME" == "${GITHUB_REF_NAME#v}" ]] || {
                echo "::error::Release version must match the current Git tag."
                exit 1
              }
              [[ "$VERSION_NAME" == "$BASE_VERSION" ]] || {
                echo "::error::Release tag/version must match app/build.gradle.kts versionName ($BASE_VERSION)."
                exit 1
              }
              URL_TAG="$GITHUB_REF_NAME"
            fi
          fi
          MODULE_VERSION_CODE="$(python3 tools/ci/module-version-code.py)"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "server_url=${ZKFC_LICENSE_SERVER_URL%/}" >> "$GITHUB_OUTPUT"
          echo "module_version_code=$MODULE_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Validated module channel=$CHANNEL version=$VERSION_NAME versionCode=$MODULE_VERSION_CODE tag=$URL_TAG"

  # Same KMI matrix pattern used by KernelSU-Next: isolated reusable DDK builds.
  lkm:
    name: Build zkfc.ko matrix
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm-zkfc.yml
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: ${{ inputs.ddk_release || '20260828' }}

  assemble:
    name: Build shared module binaries and one full KMI bundle
    needs: [validate, lkm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.99.1
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.99.1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: true

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK r30 and accept licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build and test Rust workspace
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build -p zperfd --release --locked

      - name: Build zperfd for Android ABIs
        working-directory: rust
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android31-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android31-clang"
          for item in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            target="${item%%:*}"
            abi="${item##*:}"
            cargo build -p zperfd --release --target "$target" --locked
            install -D "target/$target/release/zperfd" "../module/bin/$abi/zperfd"
            "$TC/llvm-strip" "../module/bin/$abi/zperfd"
          done

      - name: Build zkfctl for Android ABIs
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for item in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            target="${item%%:*}"
            abi="${item##*:}"
            mkdir -p "module/bin/$abi"
            "$TC/${target}31-clang" -std=c11 -O2 -Wall -Wextra -Werror \
              -fstack-protector-strong -fPIE -pie \
              -I kernel/include/uapi -I userspace/include -I userspace/lib \
              userspace/lib/*.c userspace/zkfctl/main.c -o "module/bin/$abi/zkfctl"
            "$TC/llvm-strip" "module/bin/$abi/zkfctl"
          done

      - name: Download KMI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-zkfc-lkm'
          path: lkm-artifacts

      - name: Assemble module tree and verify matrix completeness
        run: |
          set -euo pipefail
          mkdir -p module/zperf/catalog
          cp rust/zperfd/profiles/*.toml module/zperf/catalog/
          shopt -s nullglob
          count=0
          for d in lkm-artifacts/*-zkfc-lkm; do
            base=$(basename "$d")
            arch=${base%%-*}
            rest=${base#*-}
            kmi=${rest%-zkfc-lkm}
            case "$arch" in
              aarch64) abidir=arm64 ;;
              x86_64) abidir=x86_64 ;;
              *) echo "::error::Unexpected LKM artifact architecture: $arch"; exit 1 ;;
            esac
            ko=$(find "$d" -type f -name '*_zkfc.ko' -print -quit)
            [[ -n "$ko" && -f "$ko" ]] || { echo "::error::No zkfc.ko in $d"; exit 1; }
            mkdir -p "module/lkm/$kmi-$abidir"
            install -m 0644 "$ko" "module/lkm/$kmi-$abidir/zkfc.ko"
            (cd "module/lkm/$kmi-$abidir" && sha256sum zkfc.ko > zkfc.ko.sha256)
            count=$((count + 1))
          done
          [[ "$count" -eq 16 ]] || {
            echo "::error::Expected 16 KMI/architecture kernel modules, received $count."
            exit 1
          }

      - name: Create standalone KMI module bundle and verify every KMI/architecture pair
        run: |
          set -euo pipefail
          expected_kmis=(
            android12-5.10 android13-5.10 android13-5.15 android14-5.15
            android14-6.1 android15-6.6 android16-6.12 android17-6.18
          )
          for kmi in "${expected_kmis[@]}"; do
            for arch in arm64 x86_64; do
              ko="module/lkm/$kmi-$arch/zkfc.ko"
              test -s "$ko" || { echo "::error::Missing KMI module: $ko"; exit 1; }
              test -s "$ko.sha256" || { echo "::error::Missing checksum: $ko.sha256"; exit 1; }
              (cd "$(dirname "$ko")" && sha256sum -c zkfc.ko.sha256)
            done
          done
          count="$(find module/lkm -type f -name zkfc.ko | wc -l | tr -d ' ')"
          [[ "$count" == 16 ]] || { echo "::error::Expected 16 KMI .ko files, found $count"; exit 1; }
          rm -f Zairenkai-KMI-modules.zip Zairenkai-KMI-modules.zip.sha256 Zairenkai-KMI-SHA256SUMS
          (cd module/lkm && zip -qr9 "$GITHUB_WORKSPACE/Zairenkai-KMI-modules.zip" .)
          (cd module/lkm && find . -type f -name zkfc.ko -print0 | sort -z | xargs -0 sha256sum) > Zairenkai-KMI-SHA256SUMS
          sha256sum Zairenkai-KMI-modules.zip > Zairenkai-KMI-modules.zip.sha256
          unzip -t Zairenkai-KMI-modules.zip >/dev/null
          echo "Verified 16 KMI binaries across 8 KMI lines and 2 architectures."

      - name: Upload shared standalone KMI bundle
        uses: actions/upload-artifact@v7
        with:
          name: kmi-bundle
          path: |
            Zairenkai-KMI-modules.zip
            Zairenkai-KMI-modules.zip.sha256
            Zairenkai-KMI-SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Prepare channel-neutral module tree
        run: |
          set -euo pipefail
          rm -f module/SHA256SUMS
          zip -qr9 Zairenkai-module-base.zip module
          unzip -t Zairenkai-module-base.zip >/dev/null

      - name: Upload channel-neutral module tree
        uses: actions/upload-artifact@v7
        with:
          name: module-base
          path: Zairenkai-module-base.zip
          if-no-files-found: error
          retention-days: 7

  # Metadata and module.prop are channel-specific, but the actual KMI binaries
  # above are compiled once and shared; this avoids doubling the expensive KMI matrix.
  package-channel:
    name: Package flashable module / ${{ matrix.channel }}
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.channel == 'both' && '["canary","release"]' || format('["{0}"]', inputs.channel)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download common module tree
        uses: actions/download-artifact@v8.0.2
        with:
          name: module-base
          path: base-artifact
      - name: Restore module tree
        run: |
          set -euo pipefail
          ARCHIVE="base-artifact/Zairenkai-module-base.zip"
          RESTORE_DIR="$RUNNER_TEMP/zairenkai-module-restore"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null

          # Extract into a clean staging directory. The checkout already contains
          # module/META-INF/... files, so extracting over the checkout prompts for
          # overwrite and fails on the non-interactive Actions runner.
          rm -rf "$RESTORE_DIR"
          mkdir -p "$RESTORE_DIR"
          unzip -q "$ARCHIVE" -d "$RESTORE_DIR"
          test -s "$RESTORE_DIR/module/module.prop"
          test -n "$(find "$RESTORE_DIR/module/lkm" -type f -name zkfc.ko -print -quit)"

          # Replace the checked-out template only after the staged archive passes validation.
          rm -rf module
          mv "$RESTORE_DIR/module" module
          test -s module/module.prop
          test -n "$(find module/lkm -type f -name zkfc.ko -print -quit)"

      - name: Stamp channel-specific module update metadata
        env:
          CHANNEL: ${{ matrix.channel }}
          BASE_VERSION: ${{ needs.validate.outputs.base_version }}
          REQUESTED_VERSION: ${{ inputs.version_name || '' }}
          ZKFC_LICENSE_SERVER_URL: ${{ needs.validate.outputs.server_url }}
          ALLOW_UNPUBLISHED_RELEASE: ${{ inputs.allow_unpublished_release }}
          MODULE_VERSION_CODE: ${{ needs.validate.outputs.module_version_code }}
        run: |
          set -euo pipefail
          python3 tools/ci/test-configure-module-update.py
          python3 tools/ci/test-module-version-code.py
          if [[ "$CHANNEL" == canary ]]; then
            VERSION_NAME="${BASE_VERSION}-canary.${GITHUB_RUN_NUMBER}"
            URL_TAG=canary
          else
            if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION_NAME="${GITHUB_REF_NAME#v}"
              [[ "$VERSION_NAME" == "$BASE_VERSION" ]] || { echo "::error::Release tag/version must match app versionName ($BASE_VERSION)."; exit 1; }
              URL_TAG="$GITHUB_REF_NAME"
            elif [[ "$ALLOW_UNPUBLISHED_RELEASE" == true && "$GITHUB_REF_TYPE" != tag ]]; then
              VERSION_NAME="$BASE_VERSION"
              URL_TAG="v${BASE_VERSION}"
              echo "::notice::This Release-channel module is a branch validation artifact, not a published stable package."
            else
              echo "::error::Release module packaging requires a stable tag unless allow_unpublished_release is explicitly true."
              exit 1
            fi
          fi
          echo "Packaging channel=$CHANNEL version=$VERSION_NAME versionCode=$MODULE_VERSION_CODE"
          python3 tools/ci/configure-module-update.py \
            --module-dir module --channel "$CHANNEL" --version-name "$VERSION_NAME" \
            --version-code "$MODULE_VERSION_CODE" --server-url "$ZKFC_LICENSE_SERVER_URL" \
            --zip-url "https://github.com/FebriCahyaa/Zairenkai/releases/download/${URL_TAG}/Zairenkai-module.zip" \
            --changelog-url "https://github.com/FebriCahyaa/Zairenkai/releases/tag/${URL_TAG}" \
            --metadata-output "module-update-${CHANNEL}.json"

      - name: Package module and generate checksums
        run: |
          set -euo pipefail
          test -n "$(find module/lkm -type f -name 'zkfc.ko' -print -quit)"
          : > module/SHA256SUMS
          # META-INF contains the updater/installer trampoline. Recovery/root
          # managers consume these archive-level files; they are not installed
          # into MODPATH, so listing them in SHA256SUMS breaks the on-device
          # payload-count check (manifest=99, installed files=97).
          (cd module && find . -type f ! -name SHA256SUMS ! -path './META-INF/*' -print0 | sort -z | xargs -0 sha256sum) > module/SHA256SUMS
          (cd module && zip -r9 ../Zairenkai-module.zip . -x '*.git*')
          cp module/SHA256SUMS SHA256SUMS
          sha256sum Zairenkai-module.zip
          unzip -t Zairenkai-module.zip >/dev/null
          python3 tools/ci/test-module-payload-manifest.py --module-dir module --archive Zairenkai-module.zip

      - name: Upload channel-specific module artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-zip-${{ matrix.channel }}
          path: |
            Zairenkai-module.zip
            SHA256SUMS
            module-update-${{ matrix.channel }}.json
          if-no-files-found: error
          retention-days: 7
