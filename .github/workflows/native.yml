name: Native (crypto + userspace + module compile)

on:
  push:
    branches: [main]
    paths: ["kernel/**", "userspace/**", "tests/**", "rust/**", "database/**", "module/zperf/database/**", "tools/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["kernel/**", "userspace/**", "tests/**", "rust/**", "database/**", "module/zperf/database/**", "tools/**"]
  workflow_dispatch:

# Keep only the newest run per ref; lighten the hosted-runner load.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs are chained with `needs:` so at most one runs at a time. This fits a
  # small concurrent-runner budget (they queue one after another instead of
  # all at once).
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install deps
        run: python3 -m pip install --quiet cryptography
      - name: Generate vectors
        run: python3 tests/crypto/gen_vectors.py /tmp/vectors.txt
      - name: Build + run crypto tests (ASan/UBSan)
        run: |
          gcc -O2 -Wall -Wextra -Werror -std=c11 -fsanitize=address,undefined \
            -I kernel/crypto tests/crypto/crypto_test.c \
            kernel/crypto/zk_sha512.c kernel/crypto/zk_ed25519.c -o /tmp/crypto_test
          /tmp/crypto_test /tmp/vectors.txt

  data-plane:
    needs: crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate device and kernel data
        run: python3 tools/profile_validate.py database
      - name: Validate Atlas source and provider registry
        run: python3 tools/atlas_validate.py
      - name: Verify packaged module database matches source database
        run: diff -qr database module/zperf/database
      - name: Validate measurement analyzer
        run: |
          python3 tools/zperf_analyze.py summary tests/analysis/baseline.jsonl >/tmp/zperf-summary.json
          python3 tools/zperf_analyze.py compare tests/analysis/baseline.jsonl tests/analysis/candidate.jsonl >/tmp/zperf-compare.json
          grep -q 'candidate_improves_measured_performance' /tmp/zperf-compare.json
      - name: Validate thermal and performance control-plane invariants
        run: bash tests/control_plane_check.sh

  uapi-abi:
    needs: crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile and run stable UAPI ABI checks
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I. tests/abi/zkfc_uapi_test.c -o /tmp/zkfc_uapi_test
          /tmp/zkfc_uapi_test

  module-compile:
    needs: [crypto, data-plane, uapi-abi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install kernel build deps + headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bc flex bison libssl-dev libelf-dev \
            "linux-headers-$(uname -r)"
      - name: Out-of-tree module build (host arch)
        run: |
          make -C kernel KDIR="/lib/modules/$(uname -r)/build" modules
          file kernel/zkfc.ko

  userspace:
    needs: module-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android NDK r30 LTS
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build zkfctl (arm64 + x86_64)
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in aarch64-linux-android x86_64-linux-android; do
            "$TC/${triple}31-clang" -std=c11 -Wall -Wextra -Werror -O2 \
              -fstack-protector-strong -fPIE -pie \
              -I kernel/include/uapi -I userspace/include -I userspace/lib \
              userspace/lib/*.c userspace/zkfctl/main.c -o "zkfctl-$triple"
            file "zkfctl-$triple"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: zkfctl
          path: zkfctl-*
          if-no-files-found: error

  rust:
    needs: userspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.99.0
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.99.0
      - name: Format + test Rust workspace
        working-directory: rust
        run: |
          cargo fmt --check
          cargo build --release --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings
