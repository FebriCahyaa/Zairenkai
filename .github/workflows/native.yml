name: Native (crypto + userspace + module compile)

on:
  push:
    branches: [main]
    paths: ["kernel/**", "userspace/**", "tests/**", "rust/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["kernel/**", "userspace/**", "tests/**", "rust/**"]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test zkfc-sys (libc)
        working-directory: rust
        run: |
          cargo build --release --locked || cargo build --release
          cargo test


  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -q
          python3 -m pip install --quiet cryptography
      - name: Generate vectors
        run: python3 tests/crypto/gen_vectors.py /tmp/vectors.txt
      - name: Build + run crypto tests (ASan/UBSan)
        run: |
          gcc -O2 -Wall -Wextra -Werror -std=c11 -fsanitize=address,undefined \
            -I kernel/crypto tests/crypto/crypto_test.c \
            kernel/crypto/zk_sha512.c kernel/crypto/zk_ed25519.c -o /tmp/crypto_test
          /tmp/crypto_test /tmp/vectors.txt

  userspace:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
      - name: Build zkfctl (${{ matrix.abi }})
        run: |
          CC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.abi }}31-clang"
          "$CC" -std=c11 -Wall -Wextra -Werror -O2 -fstack-protector-strong -fPIE -pie \
            -I kernel/include/uapi -I userspace/include -I userspace/lib \
            userspace/lib/*.c userspace/zkfctl/main.c -o zkfctl-${{ matrix.abi }}
          file zkfctl-${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: zkfctl-${{ matrix.abi }}
          path: zkfctl-${{ matrix.abi }}

  module-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build deps + headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bc flex bison libssl-dev libelf-dev \
            "linux-headers-$(uname -r)"
      - name: Out-of-tree module build (host arch)
        run: |
          make -C kernel KDIR="/lib/modules/$(uname -r)/build" modules
          file kernel/zkfc.ko
