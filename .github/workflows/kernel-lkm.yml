# SPDX-License-Identifier: GPL-2.0-only
# Build ZKFC as a GKI loadable module for one KMI on demand, the KernelSU-Next
# way (DDK container). For all KMIs at once use build-lkm.yml.
name: GKI LKM

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: "KMI branch"
        required: true
        default: "android15-6.6"
        type: choice
        options:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18

jobs:
  lkm:
    uses: ./.github/workflows/ddk-lkm-zkfc.yml
    with:
      kmi: ${{ inputs.kmi }}
