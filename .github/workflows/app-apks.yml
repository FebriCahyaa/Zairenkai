# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
# Manually publish a previously successful Canary build from Actions artifacts.
# This workflow deliberately has no workflow_run trigger: ordinary commits never
# upload assets to GitHub Releases. Stable releases are handled by release.yml.
name: App APKs

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build Manager CI run ID to publish as Canary
        required: true
        type: string

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: app-apks-canary
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified Canary artifacts (no build steps)
    runs-on: ubuntu-24.04
    environment: canary-signing
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Resolve and verify source Build Manager CI run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="$EVENT_RUN_ID"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then RUN_ID="$REQUESTED_RUN_ID"; fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::A numeric Build Manager CI run ID is required."; exit 1; }
          RUN_JSON="$(gh run view "$RUN_ID" --repo "$REPOSITORY" --json workflowName,event,headBranch,headSha,number,conclusion)"
          WORKFLOW="$(jq -r '.workflowName' <<< "$RUN_JSON")"
          SOURCE_EVENT="$(jq -r '.event' <<< "$RUN_JSON")"
          BRANCH="$(jq -r '.headBranch' <<< "$RUN_JSON")"
          SHA="$(jq -r '.headSha' <<< "$RUN_JSON")"
          RUN_NUMBER="$(jq -r '.number' <<< "$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion' <<< "$RUN_JSON")"
          [[ "$WORKFLOW" == "Build Manager CI" ]] || { echo "::error::Run $RUN_ID is not Build Manager CI (workflow=$WORKFLOW)."; exit 1; }
          [[ "$CONCLUSION" == success ]] || { echo "::error::Source Build Manager CI run did not succeed: $CONCLUSION"; exit 1; }
          [[ "$BRANCH" == ccr-076d8b15-osiupp ]] || { echo "::error::Canary publication only accepts the Zairenkai development branch."; exit 1; }
          [[ "$SOURCE_EVENT" != pull_request ]] || { echo "::error::PR validation artifacts are not eligible for publication."; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$RUN_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Source run metadata is invalid."; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "source_event=$SOURCE_EVENT" >> "$GITHUB_OUTPUT"
          echo "Publishing artifacts from $SHA (Build Manager CI run $RUN_ID, run number $RUN_NUMBER)."

      - name: Checkout exact source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Download signed standard Canary APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: zairenkai-canary-standard-signed
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/canary-standard
      - name: Download signed Spoof Canary APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: zairenkai-canary-spoof-signed
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/canary-spoof
      - name: Download flashable module artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: module-zip-canary
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/module
      - name: Download standalone KMI matrix artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: kmi-bundle
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/kmi

      - name: Stage and verify downloaded artifacts
        run: |
          set -euo pipefail
          for file in \
            artifacts/canary-standard/Zairenkai-canary.apk \
            artifacts/canary-standard/Zairenkai-canary.apk.sha256 \
            artifacts/canary-spoof/Zairenkai-canary-spoof.apk \
            artifacts/canary-spoof/Zairenkai-canary-spoof.apk.sha256 \
            artifacts/module/Zairenkai-module.zip \
            artifacts/module/SHA256SUMS \
            artifacts/module/module-update-canary.json \
            artifacts/kmi/Zairenkai-KMI-modules.zip \
            artifacts/kmi/Zairenkai-KMI-modules.zip.sha256 \
            artifacts/kmi/Zairenkai-KMI-SHA256SUMS; do
            test -s "$file" || { echo "::error::Expected signed build artifact missing: $file"; exit 1; }
          done
          cp artifacts/canary-standard/Zairenkai-canary.apk* .
          cp artifacts/canary-spoof/Zairenkai-canary-spoof.apk* .
          cp artifacts/module/Zairenkai-module.zip artifacts/module/SHA256SUMS artifacts/module/module-update-canary.json .
          cp artifacts/kmi/Zairenkai-KMI-modules.zip artifacts/kmi/Zairenkai-KMI-modules.zip.sha256 artifacts/kmi/Zairenkai-KMI-SHA256SUMS .
          (cd artifacts/canary-standard && sha256sum -c Zairenkai-canary.apk.sha256)
          (cd artifacts/canary-spoof && sha256sum -c Zairenkai-canary-spoof.apk.sha256)
          sha256sum -c Zairenkai-KMI-modules.zip.sha256
          unzip -t Zairenkai-canary.apk >/dev/null
          unzip -t Zairenkai-canary-spoof.apk >/dev/null
          unzip -t Zairenkai-module.zip >/dev/null
          unzip -t Zairenkai-KMI-modules.zip >/dev/null
          rm -rf kmi-verify module
          mkdir -p kmi-verify module
          unzip -q Zairenkai-KMI-modules.zip -d kmi-verify
          (cd kmi-verify && sha256sum -c ../Zairenkai-KMI-SHA256SUMS)
          [[ "$(find kmi-verify -type f -name zkfc.ko | wc -l | tr -d ' ')" == 16 ]] || { echo "::error::Published KMI bundle must contain exactly 16 modules."; exit 1; }
          unzip -q Zairenkai-module.zip -d module
          (cd module && sha256sum -c SHA256SUMS)
          cp SHA256SUMS Zairenkai-module-SHA256SUMS
          sha256sum Zairenkai-canary.apk Zairenkai-canary-spoof.apk Zairenkai-module.zip Zairenkai-KMI-modules.zip > Zairenkai-canary-SHA256SUMS

      - name: Set up Python for metadata signing
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install metadata verification dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Verify live License Server and D1 readiness
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: python3 tools/ci/smoke-license-server.py "$ZKFC_LICENSE_SERVER_URL"

      - name: Validate metadata signing secrets
        env:
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          for name in ZKFC_METADATA_SIGNING_KEY_B64 ZKFC_METADATA_SIGNING_PASSPHRASE; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing required canary-signing secret: $name"; exit 1; }
          done
          [[ "$ZKFC_LICENSE_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || { echo "::error::Invalid License Server URL"; exit 1; }
          python3 tools/ci/check-api-major.py
          python3 tools/ci/test-api-major.py
          python3 tools/ci/test-update-manifest.py
          python3 tools/ci/test-version-code.py
          python3 tools/ci/test-metadata-signature.py
          python3 tools/ci/test-verify-metadata.py

      - name: Generate Canary changelog and signed updater manifest
        id: metadata
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_NUMBER: ${{ steps.source.outputs.run_number }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_NAME="${BASE_VERSION}-canary.${SOURCE_RUN_NUMBER}"
          VERSION_CODE="$(python3 tools/ci/version-code.py --version-name "$BASE_VERSION" --channel canary --run-number "$SOURCE_RUN_NUMBER")"
          API_MAJOR="$(python3 tools/ci/check-api-major.py --print)"
          BUILD_ID="${SOURCE_SHA:0:12}-${SOURCE_RUN_ID}"
          python3 tools/ci/generate-changelog.py --channel canary --version "$VERSION_NAME" --output Zairenkai-CHANGELOG.md
          python3 tools/ci/generate-update-manifest.py \
            --apk Zairenkai-canary.apk --output version-canary.json \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --apk-url "https://github.com/FebriCahyaa/Zairenkai/releases/download/canary/Zairenkai-canary.apk" \
            --api-major "$API_MAJOR" --build-id "$BUILD_ID" --commit "$SOURCE_SHA"
          python3 tools/ci/sign-metadata.py --input version-canary.json --output version-canary.json.sig
          python3 tools/ci/verify-metadata.py --input version-canary.json --signature version-canary.json.sig
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish Canary prerelease assets
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: canary
          target_commitish: ${{ steps.source.outputs.sha }}
          name: Zairenkai Canary
          prerelease: true
          body_path: Zairenkai-CHANGELOG.md
          generate_release_notes: false
          files: |
            Zairenkai-canary.apk
            Zairenkai-canary.apk.sha256
            Zairenkai-canary-spoof.apk
            Zairenkai-canary-spoof.apk.sha256
            Zairenkai-KMI-modules.zip
            Zairenkai-KMI-modules.zip.sha256
            Zairenkai-KMI-SHA256SUMS
            Zairenkai-module.zip
            SHA256SUMS
            Zairenkai-module-SHA256SUMS
            module-update-canary.json
            Zairenkai-canary-SHA256SUMS
            Zairenkai-CHANGELOG.md
            version-canary.json
            version-canary.json.sig

      - name: Verify published Canary app manifest through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: >-
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" canary
          --apk Zairenkai-canary.apk --version "$EXPECTED_VERSION_NAME" --tag canary

      - name: Verify published Canary module metadata through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: >-
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" canary
          --component module --version "$EXPECTED_VERSION_NAME" --tag canary
