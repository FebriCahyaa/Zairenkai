# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
# Build and publish only the signed, optimized Canary channel from the development
# branch. Version-tagged stable Release builds are handled only by release.yml.
# The app updater receives signed metadata via the License Server Worker; APK bytes
# remain on GitHub Releases. No debug or randomized-application-ID APK is published.
name: App APKs

on:
  push:
    branches: [ccr-076d8b15-osiupp]
    paths:
      - "app/**"
      - "rust/**"
      - "userspace/**"
      - "kernel/**"
      - "module/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app-apks.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/native.yml"
      - ".github/workflows/build-lkm.yml"
      - ".github/workflows/ddk-lkm-zkfc.yml"
      - ".github/workflows/build-module.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/build-bootpatch/action.yml"
      - "native/bootpatch/**"
      - "tools/bootpatch/**"
      - "tools/ci/**"
      - "tools/zkfc-license/**"
      - "tools/release/**"
      - "docs/security/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-apks
  cancel-in-progress: true

jobs:
  # Keep publication opt-in until the protected canary-signing environment and
  # all signing/metadata secrets are configured. The reusable module workflow is
  # also used by release.yml with channel=release.
  config:
    runs-on: ubuntu-latest
    outputs:
      has_canary: ${{ steps.c.outputs.has_canary }}
    steps:
      - id: c
        env:
          CANARY_ENABLED: ${{ vars.ZK_CANARY_ENABLED }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != branch || "$REF_NAME" != ccr-076d8b15-osiupp ]]; then
            echo "::error::Canary publication is allowed only from branch ccr-076d8b15-osiupp."
            exit 1
          fi
          if [[ "$CANARY_ENABLED" == "true" ]]; then
            echo "has_canary=true" >> "$GITHUB_OUTPUT"
            echo "Canary publication enabled; credentials will be validated in the protected canary-signing environment."
          else
            echo "has_canary=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Canary publication skipped. Set ZK_CANARY_ENABLED=true after configuring canary-signing."
          fi

  # Build the flashable module once for this Canary run. Stable Release calls
  # the same reusable workflow from release.yml with its own channel metadata.
  module:
    needs: config
    if: needs.config.outputs.has_canary == 'true'
    uses: ./.github/workflows/build-module.yml

  # --- Canary channel: signed, optimized prerelease --------------------------
  canary:
    name: Canary build (signed prerelease)
    needs: [config, module]
    if: needs.config.outputs.has_canary == 'true'
    runs-on: ubuntu-latest
    environment: canary-signing
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK platform and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Download module artifact for embedded KMI assets
        uses: actions/download-artifact@v7
        with:
          name: module-zip
          path: module-artifact
      - name: Stage module package and embedded KMI assets
        run: |
          set -euo pipefail
          cp module-artifact/Zairenkai-module.zip ./Zairenkai-module.zip
          cp module-artifact/SHA256SUMS ./SHA256SUMS
          cp module-artifact/module-update-canary.json ./module-update-canary.json
          tools/bootpatch/stage-module-assets.sh Zairenkai-module.zip
      - name: Build boot-patch backend
        uses: ./.github/actions/build-bootpatch
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Set up Python for metadata verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install metadata verification dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Validate Canary signing and update-server configuration
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          for name in ZK_KEYSTORE_BASE64 ZK_KEYSTORE_PASSWORD ZK_KEY_ALIAS ZK_KEY_PASSWORD \
                      ZKFC_METADATA_SIGNING_KEY_B64 ZKFC_METADATA_SIGNING_PASSPHRASE; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing required canary-signing secret: $name"; exit 1; }
          done
          [[ "$ZKFC_LICENSE_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || {
            echo "::error::Set ZKFC_LICENSE_SERVER_URL in canary-signing as an HTTPS origin without a path."
            exit 1
          }
          python3 tools/ci/check-api-major.py
          python3 tools/ci/test-api-major.py
          python3 tools/ci/test-update-manifest.py
          python3 tools/ci/test-version-code.py
          python3 tools/ci/test-metadata-signature.py
          python3 tools/ci/test-verify-metadata.py

      - name: Compute Canary version code
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_CODE="$(python3 tools/ci/version-code.py --version-name "$BASE_VERSION" --channel canary --run-number "$GITHUB_RUN_NUMBER")"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${BASE_VERSION}-canary.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests and build signed Canary APK
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          ./gradlew :app:test :app:assembleStandardCanary \
            "-PversionCode=${{ steps.version.outputs.code }}" \
            "-PlicenseServerUrl=$ZKFC_LICENSE_SERVER_URL" --stacktrace
      - name: Verify Canary APK signer and signature schemes
        env:
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/standard/canary -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" && -f "$APK" ]] || { echo "::error::Canary APK not found"; exit 1; }
          tools/ci/verify-release-apk.sh "$APK" app/build/zk-release.jks

      - name: Stage Canary APK and signed update manifest
        id: stage
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/standard/canary -type f -name '*.apk' -print -quit)"
          APK="Zairenkai-canary.apk"
          cp "$SRC" "$APK"
          unzip -t "$APK" >/dev/null
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "$SHA  $APK" > "$APK.sha256"
          API_MAJOR="$(python3 tools/ci/check-api-major.py --print)"
          BUILD_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 tools/ci/generate-update-manifest.py \
            --apk "$APK" --output version-canary.json \
            --version-name "${{ steps.version.outputs.name }}" \
            --version-code "${{ steps.version.outputs.code }}" \
            --apk-url "https://github.com/FebriCahyaa/Zairenkai/releases/download/canary/$APK" \
            --api-major "$API_MAJOR" --build-id "$BUILD_ID" --commit "$GITHUB_SHA"
          echo "ver=${{ steps.version.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Sign and verify Canary update metadata
        env:
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 tools/ci/sign-metadata.py --input version-canary.json --output version-canary.json.sig
          python3 tools/ci/verify-metadata.py --input version-canary.json --signature version-canary.json.sig

      - name: Publish Canary prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: canary
          name: "Zairenkai Canary"
          prerelease: true
          body: |
            **Canary build** — optimized and non-debuggable. It uses the official APK signing identity,
            verifies signed update metadata, and bundles the checksum-verified Zairenkai module.
            Canary is for early testing; use Release for normal daily use.

            Version: `${{ steps.stage.outputs.ver }}`
            APK SHA-256: `${{ steps.stage.outputs.sha }}`

            Verify before installing: `sha256sum Zairenkai-canary.apk`
          files: |
            Zairenkai-canary.apk
            Zairenkai-canary.apk.sha256
            version-canary.json
            version-canary.json.sig
            Zairenkai-module.zip
            SHA256SUMS
            module-update-canary.json
