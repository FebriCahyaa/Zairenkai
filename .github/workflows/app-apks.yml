# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
# Build and publish signed, optimized Canary APKs (standard + randomized Spoof)
# from the development branch. Stable tags are handled only by release.yml.
# The updater manifest intentionally points at the standard APK; Spoof IDs change
# per build and therefore do not participate in in-app updates.
name: App APKs

on:
  push:
    branches: [ccr-076d8b15-osiupp]
    paths:
      - "app/**"
      - "rust/**"
      - "userspace/**"
      - "kernel/**"
      - "module/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app-apks.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/native.yml"
      - ".github/workflows/build-lkm.yml"
      - ".github/workflows/ddk-lkm-zkfc.yml"
      - ".github/workflows/build-module.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/build-bootpatch/action.yml"
      - "native/bootpatch/**"
      - "tools/bootpatch/**"
      - "tools/ci/**"
      - "tools/zkfc-license/**"
      - "tools/release/**"
      - "docs/security/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-apks
  cancel-in-progress: true

jobs:
  # Fail loudly on a wrong ref; do not silently skip a release due to a feature flag.
  config:
    runs-on: ubuntu-24.04
    outputs:
      has_canary: ${{ steps.c.outputs.has_canary }}
    steps:
      - id: c
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != branch || "$REF_NAME" != ccr-076d8b15-osiupp ]]; then
            echo "::error::Canary publication is allowed only from branch ccr-076d8b15-osiupp."
            exit 1
          fi
          echo "has_canary=true" >> "$GITHUB_OUTPUT"
          echo "Canary publication is mandatory for this branch; missing signing/server configuration will fail the build."

  # Build the flashable module once for this Canary run. Stable Release calls
  # the same reusable workflow from release.yml with its own channel metadata.
  module:
    needs: config
    if: needs.config.outputs.has_canary == 'true'
    uses: ./.github/workflows/build-module.yml

  # --- Canary channel: signed, optimized prerelease --------------------------
  canary:
    name: Canary build (signed prerelease)
    needs: [config, module]
    if: needs.config.outputs.has_canary == 'true'
    runs-on: ubuntu-24.04
    environment: canary-signing
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK platform and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Download module artifact for embedded KMI assets
        uses: actions/download-artifact@v7
        with:
          name: module-zip
          path: module-artifact
      - name: Download standalone KMI release artifact
        uses: actions/download-artifact@v7
        with:
          name: kmi-bundle
          path: kmi-artifact
      - name: Stage module package and embedded KMI assets
        run: |
          set -euo pipefail
          cp module-artifact/Zairenkai-module.zip ./Zairenkai-module.zip
          cp module-artifact/SHA256SUMS ./SHA256SUMS
          cp module-artifact/module-update-canary.json ./module-update-canary.json
          cp kmi-artifact/Zairenkai-KMI-modules.zip ./Zairenkai-KMI-modules.zip
          cp kmi-artifact/Zairenkai-KMI-modules.zip.sha256 ./Zairenkai-KMI-modules.zip.sha256
          cp kmi-artifact/Zairenkai-KMI-SHA256SUMS ./Zairenkai-KMI-SHA256SUMS
          sha256sum -c Zairenkai-KMI-modules.zip.sha256
          rm -rf kmi-verify && mkdir -p kmi-verify
          unzip -q Zairenkai-KMI-modules.zip -d kmi-verify
          (cd kmi-verify && sha256sum -c ../Zairenkai-KMI-SHA256SUMS)
          KMI_COUNT="$(find kmi-verify -type f -name zkfc.ko | wc -l | tr -d ' ')"
          [[ "$KMI_COUNT" == 16 ]] || { echo "::error::KMI archive must contain 16 zkfc.ko files, found $KMI_COUNT"; exit 1; }
          tools/bootpatch/stage-module-assets.sh Zairenkai-module.zip
      - name: Build boot-patch backend
        uses: ./.github/actions/build-bootpatch
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Set up Python for metadata verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install metadata verification dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Verify live License Server and D1 readiness
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: python3 tools/ci/smoke-license-server.py "$ZKFC_LICENSE_SERVER_URL"

      - name: Validate Canary signing and update-server configuration
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          for name in ZK_KEYSTORE_BASE64 ZK_KEYSTORE_PASSWORD ZK_KEY_ALIAS ZK_KEY_PASSWORD \
                      ZKFC_METADATA_SIGNING_KEY_B64 ZKFC_METADATA_SIGNING_PASSPHRASE; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing required canary-signing secret: $name"; exit 1; }
          done
          [[ "$ZKFC_LICENSE_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || {
            echo "::error::Set ZKFC_LICENSE_SERVER_URL in canary-signing as an HTTPS origin without a path."
            exit 1
          }
          python3 tools/ci/check-api-major.py
          python3 tools/ci/test-api-major.py
          python3 tools/ci/test-update-manifest.py
          python3 tools/ci/test-version-code.py
          python3 tools/ci/test-metadata-signature.py
          python3 tools/ci/test-verify-metadata.py

      - name: Compute Canary version code
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_CODE="$(python3 tools/ci/version-code.py --version-name "$BASE_VERSION" --channel canary --run-number "$GITHUB_RUN_NUMBER")"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${BASE_VERSION}-canary.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate randomized Spoof package ID
        id: spoof
        run: |
          set -euo pipefail
          APP_ID="$(python3 tools/ci/generate-spoof-package-id.py)"
          [[ "$APP_ID" =~ ^[a-z]{6}(\.[a-z]{6}){2}$ ]] || { echo "::error::Generated Spoof package ID is invalid"; exit 1; }
          echo "application_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Generated per-run Spoof application ID: $APP_ID"

      - name: Unit tests and build signed Canary APKs (standard + Spoof)
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          ./gradlew :app:test :app:assembleStandardCanary :app:assembleSpoofCanary \
            "-PversionCode=${{ steps.version.outputs.code }}" \
            "-PspoofApplicationId=${{ steps.spoof.outputs.application_id }}" \
            "-PlicenseServerUrl=$ZKFC_LICENSE_SERVER_URL" --no-daemon --stacktrace
      - name: Verify both Canary APK signatures
        env:
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for flavor in standard spoof; do
            SRC="$(find "app/build/outputs/apk/$flavor/canary" -type f -name '*.apk' -print -quit)"
            [[ -n "$SRC" && -s "$SRC" ]] || { echo "::error::Canary APK missing for flavor=$flavor"; exit 1; }
            if [[ "$flavor" == standard ]]; then OUT=Zairenkai-canary.apk; else OUT=Zairenkai-canary-spoof.apk; fi
            cp "$SRC" "$OUT"
            tools/ci/verify-release-apk.sh "$OUT" app/build/zk-release.jks
            unzip -t "$OUT" >/dev/null
            sha256sum "$OUT" > "$OUT.sha256"
          done

      - name: Stage Canary APK and signed update manifest
        id: stage
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          APK="Zairenkai-canary.apk"
          [[ -s "$APK" ]] || { echo "::error::Verified standard Canary APK was not staged"; exit 1; }
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          python3 tools/ci/generate-changelog.py --channel canary --version "${{ steps.version.outputs.name }}" --output Zairenkai-CHANGELOG.md
          API_MAJOR="$(python3 tools/ci/check-api-major.py --print)"
          BUILD_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 tools/ci/generate-update-manifest.py \
            --apk "$APK" --output version-canary.json \
            --version-name "${{ steps.version.outputs.name }}" \
            --version-code "${{ steps.version.outputs.code }}" \
            --apk-url "https://github.com/FebriCahyaa/Zairenkai/releases/download/canary/$APK" \
            --api-major "$API_MAJOR" --build-id "$BUILD_ID" --commit "$GITHUB_SHA"
          echo "ver=${{ steps.version.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Sign and verify Canary update metadata
        env:
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 tools/ci/sign-metadata.py --input version-canary.json --output version-canary.json.sig
          python3 tools/ci/verify-metadata.py --input version-canary.json --signature version-canary.json.sig

      - name: Publish Canary prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: canary
          name: "Zairenkai Canary"
          prerelease: true
          body_path: Zairenkai-CHANGELOG.md
          generate_release_notes: false
          files: |
            Zairenkai-canary.apk
            Zairenkai-canary.apk.sha256
            Zairenkai-canary-spoof.apk
            Zairenkai-canary-spoof.apk.sha256
            Zairenkai-KMI-modules.zip
            Zairenkai-KMI-modules.zip.sha256
            Zairenkai-KMI-SHA256SUMS
            Zairenkai-CHANGELOG.md
            version-canary.json
            version-canary.json.sig
            Zairenkai-module.zip
            SHA256SUMS
            module-update-canary.json

      - name: Verify published Canary manifest through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          EXPECTED_VERSION_NAME: ${{ steps.stage.outputs.ver }}
        run: >-
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" canary
          --apk Zairenkai-canary.apk --version "$EXPECTED_VERSION_NAME" --tag canary

      - name: Verify published module metadata through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          EXPECTED_VERSION_NAME: ${{ steps.stage.outputs.ver }}
        run: >-
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" canary
          --component module --version "$EXPECTED_VERSION_NAME" --tag canary
