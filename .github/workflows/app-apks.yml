# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
# One run, both builds, kept apart — and each build is a complete module, like
# KSU-Next: the manager APK *and* the flashable kernel module (zkfc.ko per KMI
# + zperfd/zkfctl). The debug build goes out as a GitHub *prerelease* (tag
# "preview"); the release build goes out as a full GitHub *release* (tag
# "release"). The release job only runs when the signing secrets exist, so
# forks and branch pushes still get a debug build.
#
# Each channel also publishes a small version-<channel>.json with a stable APK
# name, so the in-app "Update app" screen can check and download without
# scraping a release page:
#   debug   -> .../releases/download/preview/{Zairenkai-debug.apk, version-debug.json}
#   release -> .../releases/latest/download/{Zairenkai-release.apk, version-release.json}
# The release is tagged with its version (v1.1.0, …); /releases/latest/download
# keeps the updater's URL stable across versions.
name: App APKs

on:
  push:
    branches: [ccr-076d8b15-osiupp]
    paths:
      - "app/**"
      - "rust/**"
      - "userspace/**"
      - "kernel/**"
      - "module/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app-apks.yml"
      - ".github/workflows/build-module.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-apks
  cancel-in-progress: true

jobs:
  # Do the release signing secrets exist? Job-level `if` cannot read secrets
  # directly, so resolve it once here and let the release job depend on it.
  config:
    runs-on: ubuntu-latest
    outputs:
      has_signing: ${{ steps.c.outputs.has_signing }}
    steps:
      - id: c
        env:
          KS: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KS" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are configured."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release job will be skipped: one or more ZK signing secrets are missing."
          fi

  # The .ko half: build the flashable module once; both channels bundle it.
  module:
    uses: ./.github/workflows/build-module.yml

  # --- Debug channel: installable debug-signed APK + module -> prerelease -----
  debug:
    name: Debug build (prerelease)
    needs: module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Unit tests
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace

      # Optimized, debug-signed, NOT debuggable — safe to hand out, ~4 MB.
      - name: Build debug-signed APK
        run: ./gradlew :app:assembleStandardPreview --stacktrace

      - name: Download module artifact
        uses: actions/download-artifact@v8.0.0
        with:
          name: module-zip

      - name: Stage APK, manifest and checksums
        id: stage
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/standard/preview -name '*.apk' | head -1)
          APK="Zairenkai-debug.apk"            # stable name for the in-app updater
          cp "$SRC" "$APK"
          unzip -t "$APK" >/dev/null            # reject a bad zip before publishing
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  $APK" > "$APK.sha256"
          VNAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VCODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          cat > version-debug.json <<EOF
          {
            "versionCode": $VCODE,
            "versionName": "$VNAME",
            "apkUrl": "https://github.com/FebriCahyaa/Zairenkai/releases/download/preview/$APK",
            "sha256": "$SHA"
          }
          EOF
          echo "ver=$VNAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish debug prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: preview
          name: "Zairenkai debug build"
          prerelease: true
          body: |
            **Debug build** — a complete module: the debug-signed manager APK
            (installs without the release keystore) plus the flashable kernel
            module (`zkfc.ko` per KMI + zperfd/zkfctl) in `Zairenkai-module.zip`.
            Optimized like release but published early and less tested.

            Version: `${{ steps.stage.outputs.ver }}`
            APK SHA-256: `${{ steps.stage.outputs.sha }}`

            Verify before installing: `sha256sum Zairenkai-debug.apk`
          files: |
            Zairenkai-debug.apk
            Zairenkai-debug.apk.sha256
            version-debug.json
            Zairenkai-module.zip
            SHA256SUMS

  # --- Release channel: signed release APK + module -> full release -----------
  release:
    name: Release build (release)
    needs: [config, module]
    if: needs.config.outputs.has_signing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Unit tests
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Validate release signing secrets
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ZK_KEYSTORE_BASE64 ZK_KEYSTORE_PASSWORD ZK_KEY_ALIAS ZK_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/zairenkai-signing"
          KEYSTORE="$RUNNER_TEMP/zairenkai-signing/release.p12"
          printf '%s' "$ZK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null
          keytool -certreq -alias "$ZK_KEY_ALIAS" -keystore "$KEYSTORE" \
            -storepass:env ZK_KEYSTORE_PASSWORD -keypass:env ZK_KEY_PASSWORD \
            -file "$RUNNER_TEMP/zairenkai-signing/release-check.csr" >/dev/null
          echo "Release keystore, alias, and key credentials are valid."

      - name: Build and sign release APK
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStandardRelease --stacktrace

      - name: Enforce v1/v2/v3 signing and verify release APK
        env:
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/standard/release -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" && -f "$APK" ]] || { echo "::error::Release APK not found"; exit 1; }
          BT="$ANDROID_HOME/build-tools/37.0.0"
          APKSIGNER="$BT/apksigner"
          KEYSTORE="app/build/zk-release.jks"
          [[ -x "$APKSIGNER" ]] || { echo "::error::apksigner not found: $APKSIGNER"; exit 1; }
          [[ -f "$KEYSTORE" ]] || { echo "::error::Gradle did not materialize the release keystore"; exit 1; }
          # Explicitly sign all required schemes instead of weakening verification.
          APKSIGNER="${APKSIGNER:-$BT/apksigner}"
          [[ -x "$APKSIGNER" ]] || { echo "::error::apksigner not found: $APKSIGNER"; exit 1; }
          if keytool -list -storetype PKCS12 -keystore "$KEYSTORE" \
              -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null 2>&1; then
            KS_TYPE=PKCS12
          elif keytool -list -storetype JKS -keystore "$KEYSTORE" \
              -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null 2>&1; then
            KS_TYPE=JKS
          else
            echo "::error::Release keystore cannot be opened as PKCS12 or JKS"
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type "$KS_TYPE" \
            --ks-key-alias "$ZK_KEY_ALIAS" \
            --ks-pass env:ZK_KEYSTORE_PASSWORD \
            --key-pass env:ZK_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"


          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose "$APK" 2>&1)" || {
            printf '%s\n' "$VERIFY_OUTPUT"
            echo "::error::apksigner could not verify the APK"
            exit 1
          }
          printf '%s\n' "$VERIFY_OUTPUT"
          for scheme in \
            'Verified using v1 scheme (JAR signing): true' \
            'Verified using v2 scheme (APK Signature Scheme v2): true' \
            'Verified using v3 scheme (APK Signature Scheme v3): true'; do
            if ! grep -Fq "$scheme" <<< "$VERIFY_OUTPUT"; then
              echo "::error::Required APK signature scheme is missing: $scheme"
              exit 1
            fi
          done

          EXPECTED="$(keytool -exportcert -alias "$ZK_KEY_ALIAS" -keystore "$KEYSTORE" \
            -storepass:env ZK_KEYSTORE_PASSWORD | sha256sum | awk '{print toupper($1)}')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | \
            sed -n 's/.*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' | \
            head -1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          [[ "$EXPECTED" =~ ^[A-F0-9]{64}$ ]] || { echo "::error::Could not calculate keystore certificate SHA-256"; exit 1; }
          [[ "$ACTUAL" =~ ^[A-F0-9]{64}$ ]] || { echo "::error::Could not read APK certificate SHA-256"; exit 1; }
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::APK signer does not match the configured release keystore certificate"
            echo "Keystore SHA-256: $EXPECTED"
            echo "APK SHA-256:      $ACTUAL"
            exit 1
          }
          echo "Verified: APK signature schemes v1, v2 and v3 are present; signer matches the configured keystore."

      - name: Download module artifact
        uses: actions/download-artifact@v8.0.0
        with:
          name: module-zip

      - name: Stage APK, manifest and checksums
        id: stage
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/standard/release -name '*.apk' | head -1)
          APK="Zairenkai-release.apk"           # stable name for the in-app updater
          cp "$SRC" "$APK"
          unzip -t "$APK" >/dev/null
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  $APK" > "$APK.sha256"
          VNAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VCODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          # The APK lives on a versioned tag, but the updater fetches it through
          # /releases/latest/download/, which GitHub resolves to the newest
          # (non-prerelease) release regardless of its tag name — a stable URL.
          cat > version-release.json <<EOF
          {
            "versionCode": $VCODE,
            "versionName": "$VNAME",
            "apkUrl": "https://github.com/FebriCahyaa/Zairenkai/releases/latest/download/$APK",
            "sha256": "$SHA"
          }
          EOF
          echo "ver=$VNAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          # Versioned tag (e.g. v1.1.0). softprops creates it with GITHUB_TOKEN,
          # which does not re-trigger the v*-tag release.yml workflow.
          tag_name: v${{ steps.stage.outputs.ver }}
          name: "Zairenkai v${{ steps.stage.outputs.ver }}"
          prerelease: false
          make_latest: true
          body: |
            **Release build** — a complete module: the stable, officially signed
            manager APK plus the flashable kernel module (`zkfc.ko` per KMI +
            zperfd/zkfctl) in `Zairenkai-module.zip`. Recommended for everyday use.

            Version: `${{ steps.stage.outputs.ver }}`
            APK SHA-256: `${{ steps.stage.outputs.sha }}`

            Verify before installing: `sha256sum Zairenkai-release.apk`
          files: |
            Zairenkai-release.apk
            Zairenkai-release.apk.sha256
            version-release.json
            Zairenkai-module.zip
            SHA256SUMS
