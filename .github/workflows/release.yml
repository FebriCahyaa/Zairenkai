# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
name: Release

# Stable tags and GitHub Releases are created only from an explicit Actions run.
# Ordinary pushes and manually pushed tags do not publish release artifacts.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Stable MAJOR.MINOR.PATCH version matching app/build.gradle.kts (example: 1.1.0)"
        required: true
        type: string
      overwrite_existing_release:
        description: "Replace an existing GitHub Release and tag for this version (destructive; use only to correct a bad release)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate_tag:
    name: Validate manual stable Release request
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      overwrite: ${{ steps.meta.outputs.overwrite }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate requested version and prepare the automatic tag
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          OVERWRITE_EXISTING_RELEASE: ${{ inputs.overwrite_existing_release }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Enter a stable semantic version such as 1.1.0 (without a leading v)."
            exit 1
          }
          BASE_VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          [[ "$VERSION" == "$BASE_VERSION" ]] || {
            echo "::error::Requested version $VERSION must match app/build.gradle.kts versionName $BASE_VERSION. Update the app version in a separate commit first."
            exit 1
          }
          RELEASE_TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [[ "$OVERWRITE_EXISTING_RELEASE" != "true" ]]; then
              echo "::error::Tag $RELEASE_TAG already exists. Choose a new version or enable overwrite_existing_release to replace it."
              exit 1
            fi
            echo "::warning::Overwrite enabled for $RELEASE_TAG. The existing Release/tag will be removed only after all build and signing checks pass."
          fi
          python3 tools/ci/test-validate-release-tag.py
          python3 tools/ci/validate-release-tag.py --tag "$RELEASE_TAG"
          python3 tools/ci/test-owner-key-provisioning.py
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "overwrite=$OVERWRITE_EXISTING_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Validated manual Release request: $RELEASE_TAG. The tag will be created only after the build and metadata checks pass."

  module:
    name: Full KMI matrix and signed-channel module package
    needs: validate_tag
    uses: ./.github/workflows/build-module.yml
    with:
      channel: release
      version_name: ${{ needs.validate_tag.outputs.version }}
      allow_unpublished_release: true
      server_url: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
    permissions:
      contents: read

  # Each flavor is an independent reusable workflow job; signing and checksums
  # are verified before its artifact is made available to the aggregate job.
  build-manager:
    name: Release / ${{ matrix.variant }} APK
    needs: [validate_tag, module]
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, spoof]
    uses: ./.github/workflows/build-manager.yml
    with:
      channel: release
      variant: ${{ matrix.variant }}
      require_signing: true
      license_server_url: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
      version_name: ${{ needs.validate_tag.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  package:
    name: Verify, sign release metadata and publish
    needs: [validate_tag, module, build-manager]
    runs-on: ubuntu-24.04
    environment: production-signing
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK for signer verification
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Enforce a provisioned ZKFC owner public key
        run: python3 tools/ci/test-owner-key-provisioning.py

      - name: Download Standard Release APK artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: zairenkai-release-standard-signed
          path: artifacts/release-standard
      - name: Download Spoof Release APK artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: zairenkai-release-spoof-signed
          path: artifacts/release-spoof
      - name: Download channel-specific module artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: module-zip-release
          path: module-artifact
      - name: Download standalone KMI artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: kmi-bundle
          path: kmi-artifact

      - name: Stage artifacts and verify all checksums
        run: |
          set -euo pipefail
          for file in \
            artifacts/release-standard/Zairenkai-release.apk \
            artifacts/release-standard/Zairenkai-release.apk.sha256 \
            artifacts/release-spoof/Zairenkai-spoofed-release.apk \
            artifacts/release-spoof/Zairenkai-spoofed-release.apk.sha256 \
            module-artifact/Zairenkai-module.zip \
            module-artifact/SHA256SUMS \
            module-artifact/module-update-release.json \
            kmi-artifact/Zairenkai-KMI-modules.zip \
            kmi-artifact/Zairenkai-KMI-modules.zip.sha256 \
            kmi-artifact/Zairenkai-KMI-SHA256SUMS; do
            test -s "$file" || { echo "::error::Required matrix artifact missing: $file"; exit 1; }
          done
          cp artifacts/release-standard/Zairenkai-release.apk* .
          cp artifacts/release-spoof/Zairenkai-spoofed-release.apk* .
          cp module-artifact/Zairenkai-module.zip module-artifact/SHA256SUMS module-artifact/module-update-release.json .
          cp kmi-artifact/Zairenkai-KMI-modules.zip kmi-artifact/Zairenkai-KMI-modules.zip.sha256 kmi-artifact/Zairenkai-KMI-SHA256SUMS .
          cp SHA256SUMS Zairenkai-module-SHA256SUMS
          (cd artifacts/release-standard && sha256sum -c Zairenkai-release.apk.sha256)
          (cd artifacts/release-spoof && sha256sum -c Zairenkai-spoofed-release.apk.sha256)
          sha256sum -c Zairenkai-KMI-modules.zip.sha256
          unzip -t Zairenkai-release.apk >/dev/null
          unzip -t Zairenkai-spoofed-release.apk >/dev/null
          unzip -t Zairenkai-module.zip >/dev/null
          unzip -t Zairenkai-KMI-modules.zip >/dev/null
          rm -rf kmi-verify module
          mkdir -p kmi-verify module
          unzip -q Zairenkai-KMI-modules.zip -d kmi-verify
          (cd kmi-verify && sha256sum -c ../Zairenkai-KMI-SHA256SUMS)
          [[ "$(find kmi-verify -type f -name zkfc.ko | wc -l | tr -d ' ')" == 16 ]] || { echo "::error::KMI archive must contain exactly 16 modules."; exit 1; }
          unzip -q Zairenkai-module.zip -d module
          (cd module && sha256sum -c SHA256SUMS)
          python3 tools/ci/test_release_manifest.py
          python3 tools/ci/test-version-code.py
          python3 tools/ci/test-update-manifest.py
          python3 tools/ci/test-metadata-signature.py
          python3 tools/ci/test-verify-metadata.py
          python3 tools/ci/test-verify-release-manifest.py

      - name: Set up Python and metadata signing dependency
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install metadata verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Verify live License Server and D1 readiness
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: python3 tools/ci/smoke-license-server.py "$ZKFC_LICENSE_SERVER_URL"

      - name: Validate release metadata signing secrets and public key
        env:
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in ZKFC_METADATA_SIGNING_KEY_B64 ZKFC_METADATA_SIGNING_PASSPHRASE; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing required production-signing secret: $name"; exit 1; }
          done
          grep -q '^-----BEGIN PUBLIC KEY-----' app/src/main/assets/security/update-metadata-public-key.pem || {
            echo "::error::Pinned update metadata public key is not provisioned; refusing unsigned metadata."; exit 1;
          }
          python3 tools/ci/check-api-major.py

      - name: Verify signed APKs use the configured Release certificate
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ZK_KEYSTORE_BASE64 ZK_KEYSTORE_PASSWORD ZK_KEY_ALIAS ZK_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing release APK signing secret: $name"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/zairenkai-signing"
          printf '%s' "$ZK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zairenkai-signing/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/zairenkai-signing/release.p12" -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null
          BT="$ANDROID_HOME/build-tools/37.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
          EXPECTED="$(keytool -exportcert -alias "$ZK_KEY_ALIAS" -keystore "$RUNNER_TEMP/zairenkai-signing/release.p12" -storepass:env ZK_KEYSTORE_PASSWORD | sha256sum | awk '{print toupper($1)}')"
          for APK in Zairenkai-release.apk Zairenkai-spoofed-release.apk; do
            # Match the signer validation contract in verify-release-apk.sh: validate the APK from API 23, including v1.
            VERIFY_OUTPUT="$("$BT/apksigner" verify --verbose --min-sdk-version 23 "$APK" 2>&1)" || { printf '%s\n' "$VERIFY_OUTPUT"; exit 1; }
            for scheme in 'Verified using v1 scheme (JAR signing): true' 'Verified using v2 scheme (APK Signature Scheme v2): true' 'Verified using v3 scheme (APK Signature Scheme v3): true'; do
              grep -Fq "$scheme" <<< "$VERIFY_OUTPUT" || {
                printf '%s\n' "$VERIFY_OUTPUT"
                echo "::error::Required signature scheme missing: $scheme ($APK)"
                exit 1
              }
            done
            CERT_OUTPUT="$("$BT/apksigner" verify --print-certs "$APK" 2>&1)"
            ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" | awk '/certificate SHA-256 digest:/ { sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); gsub(/[^[:xdigit:]]/, ""); if (length($0) == 64) { print toupper($0); exit } }')"
            [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "::error::Release signing certificate mismatch for $APK"; exit 1; }
            sha256sum -c "$APK.sha256"
          done
          echo "Both separately-built Release variants are signed with the expected certificate."

      - name: Generate Release changelog and standard updater manifest
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
          VERSION_NAME: ${{ needs.validate_tag.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(python3 tools/ci/version-code.py --version-name "$VERSION_NAME" --channel release)"
          API_MAJOR="$(python3 tools/ci/check-api-major.py --print)"
          BUILD_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 tools/ci/generate-changelog.py --channel release --tag "$RELEASE_TAG" --version "$RELEASE_TAG" --output Zairenkai-CHANGELOG.md
          python3 tools/ci/generate-update-manifest.py \
            --apk Zairenkai-release.apk --output version-release.json \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --apk-url "https://github.com/FebriCahyaa/Zairenkai/releases/download/${RELEASE_TAG}/Zairenkai-release.apk" \
            --api-major "$API_MAJOR" --build-id "$BUILD_ID" --commit "$GITHUB_SHA"
          python3 tools/ci/generate-release-manifest.py \
            --version "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Sign and verify stable update metadata
        env:
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 tools/ci/sign-metadata.py --input version-release.json --output version-release.json.sig
          python3 tools/ci/verify-metadata.py --input version-release.json --signature version-release.json.sig
          python3 tools/ci/sign-metadata.py --input Zairenkai-release-manifest.json --output Zairenkai-release-manifest.json.sig
          python3 tools/ci/verify-release-manifest.py --manifest Zairenkai-release-manifest.json --signature Zairenkai-release-manifest.json.sig

      - name: Generate final Release checksums
        run: |
          set -euo pipefail
          sha256sum \
            Zairenkai-module.zip \
            Zairenkai-release.apk Zairenkai-release.apk.sha256 \
            Zairenkai-spoofed-release.apk Zairenkai-spoofed-release.apk.sha256 \
            Zairenkai-KMI-modules.zip Zairenkai-KMI-modules.zip.sha256 Zairenkai-KMI-SHA256SUMS \
            Zairenkai-CHANGELOG.md module-update-release.json Zairenkai-module-SHA256SUMS \
            version-release.json version-release.json.sig \
            Zairenkai-release-manifest.json Zairenkai-release-manifest.json.sig \
            > Zairenkai-release-SHA256SUMS

      - name: Attest module ZIP provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-module.zip
      - name: Attest standard APK provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-release.apk
      - name: Attest Spoof APK provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-spoofed-release.apk
      - name: Attest standalone KMI bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-KMI-modules.zip
      - name: Attest changelog provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-CHANGELOG.md
      - name: Attest updater metadata provenance
        uses: actions/attest@v4
        with:
          subject-path: version-release.json
      - name: Attest release manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-release-manifest.json
      - name: Attest release checksum manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-release-SHA256SUMS

      - name: Remove existing Release and tag when overwrite was explicitly requested
        if: needs.validate_tag.outputs.overwrite == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$REPOSITORY" --yes --cleanup-tag
          elif gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$RELEASE_TAG"
          fi

      - name: Create stable tag and publish GitHub Release
        id: publish
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.validate_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zairenkai ${{ needs.validate_tag.outputs.tag }}
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          files: |
            Zairenkai-module.zip
            Zairenkai-module-SHA256SUMS
            SHA256SUMS
            module-update-release.json
            Zairenkai-release.apk
            Zairenkai-release.apk.sha256
            Zairenkai-spoofed-release.apk
            Zairenkai-spoofed-release.apk.sha256
            Zairenkai-KMI-modules.zip
            Zairenkai-KMI-modules.zip.sha256
            Zairenkai-KMI-SHA256SUMS
            Zairenkai-CHANGELOG.md
            version-release.json
            version-release.json.sig
            Zairenkai-release-manifest.json
            Zairenkai-release-manifest.json.sig
            Zairenkai-release-SHA256SUMS
          body_path: Zairenkai-CHANGELOG.md
          generate_release_notes: false

      - name: Verify automatically created tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json tagName,isDraft,isPrerelease \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["tagName"] == sys.argv[1] and x["isDraft"] is False and x["isPrerelease"] is False, x; print("PASS: stable tag and published release exist")' "$RELEASE_TAG"

      - name: Verify published Release app manifest through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" release \
            --apk Zairenkai-release.apk --version "${RELEASE_TAG#v}" --tag "$RELEASE_TAG"

      - name: Verify published Release module metadata through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
        run: >-
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" release
          --component module --version "${RELEASE_TAG#v}" --tag "$RELEASE_TAG"
