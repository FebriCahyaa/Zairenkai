# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate_tag:
    name: Validate monotonic stable Release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate stable semantic version and monotonic release order
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/ci/test-validate-release-tag.py
          python3 tools/ci/validate-release-tag.py --tag "$RELEASE_TAG"

  # Build the module through the same reusable workflow as Canary. The only
  # difference is the validated Release channel/version passed as inputs.
  module:
    name: Build Release module
    needs: validate_tag
    uses: ./.github/workflows/build-module.yml
    with:
      channel: release
      version_name: ${{ github.ref_name }}

  package:
    name: Package release
    needs: [validate_tag, module]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Warn if ZKFC owner signing key is not provisioned
        run: |
          if grep -Eq '^[[:space:]]*#define[[:space:]]+ZKFC_OWNER_KEY_PROVISIONED[[:space:]]+0([[:space:]]|$)' kernel/security/zkfc_owner_key.h; then
            echo "::warning::ZKFC_OWNER_KEY_PROVISIONED=0: licensed API tokens will be rejected until the owner public key is provisioned and the kernel/module is rebuilt. No fake token will be generated."
          else
            echo "ZKFC owner public key is provisioned."
          fi

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Download channel-specific module artifact
        uses: actions/download-artifact@v7
        with:
          name: module-zip
          path: module-artifact
      - name: Download standalone KMI artifact
        uses: actions/download-artifact@v7
        with:
          name: kmi-bundle
          path: kmi-artifact

      - name: Verify and unpack the reusable module artifact
        run: |
          set -euo pipefail
          test -s module-artifact/Zairenkai-module.zip
          test -s module-artifact/SHA256SUMS
          test -s module-artifact/module-update-release.json
          cp module-artifact/Zairenkai-module.zip Zairenkai-module.zip
          cp module-artifact/SHA256SUMS SHA256SUMS
          cp module-artifact/module-update-release.json module-update-release.json
          cp kmi-artifact/Zairenkai-KMI-modules.zip Zairenkai-KMI-modules.zip
          cp kmi-artifact/Zairenkai-KMI-modules.zip.sha256 Zairenkai-KMI-modules.zip.sha256
          cp kmi-artifact/Zairenkai-KMI-SHA256SUMS Zairenkai-KMI-SHA256SUMS
          sha256sum -c Zairenkai-KMI-modules.zip.sha256
          rm -rf kmi-verify && mkdir -p kmi-verify
          unzip -q Zairenkai-KMI-modules.zip -d kmi-verify
          (cd kmi-verify && sha256sum -c ../Zairenkai-KMI-SHA256SUMS)
          KMI_COUNT="$(find kmi-verify -type f -name zkfc.ko | wc -l | tr -d ' ')"
          [[ "$KMI_COUNT" == 16 ]] || { echo "::error::KMI archive must contain 16 zkfc.ko files, found $KMI_COUNT"; exit 1; }
          unzip -t Zairenkai-module.zip >/dev/null
          rm -rf module
          mkdir -p module
          unzip -q Zairenkai-module.zip -d module
          test -s module/module.prop
          test -n "$(find module/lkm -type f -name 'zkfc.ko' -print -quit)"
          (cd module && sha256sum -c SHA256SUMS)

      - name: Stage KMI-specific LKM assets in the manager APK
        run: tools/bootpatch/stage-module-assets.sh module

      - name: Build boot-patch backend
        uses: ./.github/actions/build-bootpatch

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify live License Server and D1 readiness
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: python3 tools/ci/smoke-license-server.py "$ZKFC_LICENSE_SERVER_URL"

      - name: Validate release signing secrets
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ZK_KEYSTORE_BASE64 ZK_KEYSTORE_PASSWORD ZK_KEY_ALIAS ZK_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/zairenkai-signing"
          printf '%s' "$ZK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zairenkai-signing/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/zairenkai-signing/release.p12" \
            -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null
          keytool -certreq -alias "$ZK_KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/zairenkai-signing/release.p12" \
            -storepass:env ZK_KEYSTORE_PASSWORD -keypass:env ZK_KEY_PASSWORD \
            -file "$RUNNER_TEMP/zairenkai-signing/release-check.csr" >/dev/null
          echo "Release keystore, alias, and key credentials are valid."

      - name: Embed verified root module in APK assets
        run: tools/bootpatch/stage-embedded-module.sh Zairenkai-module.zip

      - name: Generate randomized Spoof package ID
        id: spoof
        run: |
          set -euo pipefail
          APP_ID="$(python3 tools/ci/generate-spoof-package-id.py)"
          [[ "$APP_ID" =~ ^[a-z]{6}(\.[a-z]{6}){2}$ ]] || { echo "::error::Generated Spoof package ID is invalid"; exit 1; }
          echo "application_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Generated per-release Spoof application ID: $APP_ID"

      - name: Build and test official Release APK
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
        run: |
          set -euo pipefail
          [[ "$ZKFC_LICENSE_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || {
            echo "::error::Set ZKFC_LICENSE_SERVER_URL in production-signing as an HTTPS origin without a path."
            exit 1
          }
          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION_NAME" == "$TAG_VERSION" ]] || {
            echo "::error::Release tag '$TAG_VERSION' must match app versionName '$VERSION_NAME'."
            exit 1
          }
          VERSION_CODE="$(python3 tools/ci/version-code.py --version-name "$VERSION_NAME" --channel release)"
          ./gradlew :app:test :app:assembleStandardRelease :app:assembleSpoofRelease \
            "-PversionCode=$VERSION_CODE" \
            "-PspoofApplicationId=${{ steps.spoof.outputs.application_id }}" \
            "-PlicenseServerUrl=$ZKFC_LICENSE_SERVER_URL" --no-daemon --stacktrace

      - name: Stage and verify both signed Release APKs
        env:
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STANDARD_SRC="$(find app/build/outputs/apk/standard/release -type f -name '*.apk' -print -quit)"
          SPOOF_SRC="$(find app/build/outputs/apk/spoof/release -type f -name '*.apk' -print -quit)"
          [[ -n "$STANDARD_SRC" && -s "$STANDARD_SRC" ]] || { echo "::error::Standard Release APK not found"; exit 1; }
          [[ -n "$SPOOF_SRC" && -s "$SPOOF_SRC" ]] || { echo "::error::Spoof Release APK not found"; exit 1; }
          cp "$STANDARD_SRC" Zairenkai-release.apk
          cp "$SPOOF_SRC" Zairenkai-spoofed-release.apk
          for APK in Zairenkai-release.apk Zairenkai-spoofed-release.apk; do
            unzip -t "$APK" >/dev/null
            tools/ci/verify-release-apk.sh "$APK" app/build/zk-release.jks
            sha256sum "$APK" > "$APK.sha256"
          done
          python3 tools/ci/generate-changelog.py --channel release --tag "$GITHUB_REF_NAME" --version "$GITHUB_REF_NAME" --output Zairenkai-CHANGELOG.md
          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_CODE="$(python3 tools/ci/version-code.py --version-name "$VERSION_NAME" --channel release)"
          API_MAJOR="$(python3 tools/ci/check-api-major.py --print)"
          BUILD_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 tools/ci/generate-update-manifest.py \
            --apk Zairenkai-release.apk --output version-release.json \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --apk-url "https://github.com/FebriCahyaa/Zairenkai/releases/download/${GITHUB_REF_NAME}/Zairenkai-release.apk" \
            --api-major "$API_MAJOR" --build-id "$BUILD_ID" --commit "$GITHUB_SHA"

      - name: Stage module checksum manifest
        run: cp module/SHA256SUMS Zairenkai-module-SHA256SUMS

      - name: Test release metadata generator
        run: python3 tools/ci/test_release_manifest.py

      - name: Set up Python for release metadata verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify API contract and prepare metadata signer
        run: |
          set -euo pipefail
          python3 tools/ci/check-api-major.py
          python -m pip install --disable-pip-version-check cryptography
          grep -q '^-----BEGIN PUBLIC KEY-----' app/src/main/assets/security/update-metadata-public-key.pem || {
            echo "::error::The pinned update metadata public key is not provisioned; refusing an unsigned official release."
            exit 1
          }

      - name: Generate release manifest
        run: |
          set -euo pipefail
          python3 tools/ci/test_release_manifest.py
          python3 tools/ci/test-version-code.py
          python3 tools/ci/test-update-manifest.py
          python3 tools/ci/test-metadata-signature.py
          python3 tools/ci/test-verify-metadata.py
          python3 tools/ci/test-verify-release-manifest.py
          python3 tools/ci/generate-release-manifest.py \
            --version "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Sign stable update manifest
        env:
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
        run: python3 tools/ci/sign-metadata.py --input version-release.json --output version-release.json.sig

      - name: Verify signed stable update manifest
        run: python3 tools/ci/verify-metadata.py --input version-release.json --signature version-release.json.sig

      - name: Sign release manifest
        env:
          ZKFC_METADATA_SIGNING_KEY_B64: ${{ secrets.ZKFC_METADATA_SIGNING_KEY_B64 }}
          ZKFC_METADATA_SIGNING_PASSPHRASE: ${{ secrets.ZKFC_METADATA_SIGNING_PASSPHRASE }}
        run: python3 tools/ci/sign-metadata.py --input Zairenkai-release-manifest.json --output Zairenkai-release-manifest.json.sig

      - name: Verify signed release manifest and artifact hashes
        run: python3 tools/ci/verify-release-manifest.py --manifest Zairenkai-release-manifest.json --signature Zairenkai-release-manifest.json.sig

      - name: Generate release checksums
        run: |
          set -euo pipefail
          sha256sum \
            Zairenkai-module.zip \
            Zairenkai-release.apk \
            Zairenkai-release.apk.sha256 \
            Zairenkai-spoofed-release.apk \
            Zairenkai-spoofed-release.apk.sha256 \
            Zairenkai-KMI-modules.zip \
            Zairenkai-KMI-modules.zip.sha256 \
            Zairenkai-KMI-SHA256SUMS \
            Zairenkai-CHANGELOG.md \
            module-update-release.json \
            version-release.json \
            version-release.json.sig \
            Zairenkai-module-SHA256SUMS \
            Zairenkai-release-manifest.json \
            Zairenkai-release-manifest.json.sig \
            > Zairenkai-release-SHA256SUMS

      # Keyless provenance is separate from the ZKFC license key and APK upload key.
      # These attestations bind the output hashes to the GitHub Actions build identity.
      - name: Attest module ZIP provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-module.zip

      - name: Attest standard APK provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-release.apk

      - name: Attest Spoof APK provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-spoofed-release.apk

      - name: Attest standalone KMI bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-KMI-modules.zip

      - name: Attest changelog provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-CHANGELOG.md

      - name: Attest module updater metadata provenance
        uses: actions/attest@v4
        with:
          subject-path: module-update-release.json

      - name: Attest signed updater metadata provenance
        uses: actions/attest@v4
        with:
          subject-path: version-release.json

      - name: Attest updater metadata signature provenance
        uses: actions/attest@v4
        with:
          subject-path: version-release.json.sig

      - name: Attest release manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-release-manifest.json

      - name: Attest release checksum manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: Zairenkai-release-SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            Zairenkai-module.zip
            Zairenkai-release.apk
            Zairenkai-release.apk.sha256
            Zairenkai-spoofed-release.apk
            Zairenkai-spoofed-release.apk.sha256
            Zairenkai-KMI-modules.zip
            Zairenkai-KMI-modules.zip.sha256
            Zairenkai-KMI-SHA256SUMS
            Zairenkai-CHANGELOG.md
            version-release.json
            version-release.json.sig
            module-update-release.json
            Zairenkai-module-SHA256SUMS
            Zairenkai-release-manifest.json
            Zairenkai-release-manifest.json.sig
            Zairenkai-release-SHA256SUMS
          body_path: Zairenkai-CHANGELOG.md
          generate_release_notes: false

      - name: Verify published Release manifest through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" release \
            --apk Zairenkai-release.apk --version "${RELEASE_TAG#v}" --tag "$RELEASE_TAG"

      - name: Verify published module metadata through License Server
        env:
          ZKFC_LICENSE_SERVER_URL: ${{ vars.ZKFC_LICENSE_SERVER_URL }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 tools/ci/smoke-update-server.py "$ZKFC_LICENSE_SERVER_URL" release
          --component module --version "${RELEASE_TAG#v}" --tag "$RELEASE_TAG"
