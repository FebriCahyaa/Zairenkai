name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The .ko half: build zkfc.ko per KMI the KernelSU-Next way (DDK containers).
  lkm:
    uses: ./.github/workflows/build-lkm.yml

  package:
    name: Package release
    needs: lkm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build and verify signed APK
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStandardRelease :app:testStandardDebugUnitTest --stacktrace

      - name: Verify APK certificate
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/standard/release -name '*.apk' | head -1)
          BT="$ANDROID_HOME/build-tools/37.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          EXPECTED='D7E8314BD8E04B8B8598D5AFE98BBAC1D5EB2DF4930EA0F81D95741778FEC'
          ACTUAL=$(
            "$BT/apksigner" verify --print-certs "$APK" |
              sed -n 's/Signer #1 certificate SHA-256 digest: //p' |
              head -1 | tr -d '[:space:]' | tr 'a-f' 'A-F'
          )
          test "$ACTUAL" = "$EXPECTED"

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.99.0
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.99.0
      - name: Build zperfd and validate workspace
        working-directory: rust
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android31-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android31-clang"
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            target="${t%%:*}"; abi="${t##*:}"
            cargo build -p zperfd --release --target "$target" --locked
            mkdir -p "../module/bin/$abi"
            cp "target/$target/release/zperfd" "../module/bin/$abi/zperfd"
            "$TC/llvm-strip" "../module/bin/$abi/zperfd"
          done

      - name: Build zkfctl userspace
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            triple="${t%%:*}"; abi="${t##*:}"
            mkdir -p "module/bin/$abi"
            "$TC/${triple}31-clang" -std=c11 -O2 -Wall -Wextra -Werror \
              -fstack-protector-strong -fPIE -pie \
              -I kernel/include/uapi -I userspace/include -I userspace/lib \
              userspace/lib/*.c userspace/zkfctl/main.c -o "module/bin/$abi/zkfctl"
            "$TC/llvm-strip" "module/bin/$abi/zkfctl"
          done

      - name: Stage zperf catalog
        run: |
          set -euo pipefail
          mkdir -p module/zperf/catalog
          cp rust/zperfd/profiles/*.toml module/zperf/catalog/

      - name: Download zkfc.ko artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          pattern: '*-zkfc-lkm'
          path: lkm-artifacts

      - name: Lay out .ko into module/lkm/<kmi>-<abidir>
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in lkm-artifacts/*-zkfc-lkm; do
            base=$(basename "$d")
            arch=${base%%-*}
            rest=${base#*-}; kmi=${rest%-zkfc-lkm}
            case "$arch" in
              aarch64) abidir=arm64 ;;
              x86_64)  abidir=x86_64 ;;
              *) echo "unknown arch '$arch' in $base"; continue ;;
            esac
            ko=$(find "$d" -name '*_zkfc.ko' | head -1)
            [ -f "$ko" ] || { echo "no .ko in $d"; continue; }
            mkdir -p "module/lkm/$kmi-$abidir"
            cp "$ko" "module/lkm/$kmi-$abidir/zkfc.ko"
          done

      - name: Package module + checksum manifest
        run: |
          set -euo pipefail
          test -n "$(find module/lkm -name 'zkfc.ko' -print -quit)"
          : > module/SHA256SUMS
          (cd module && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > module/SHA256SUMS
          cd module
          zip -r9 ../Zairenkai-module.zip . -x '*.git*'
          cd ..
          sha256sum Zairenkai-module.zip

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            Zairenkai-module.zip
            app/build/outputs/apk/standard/release/*.apk
            module/SHA256SUMS
          generate_release_notes: true
