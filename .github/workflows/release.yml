# SPDX-License-Identifier: LicenseRef-Zairenkai-Proprietary
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The .ko half: build zkfc.ko per KMI the KernelSU-Next way (DDK containers).
  lkm:
    uses: ./.github/workflows/build-lkm.yml

  package:
    name: Package release
    needs: lkm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Generate randomized spoofed application ID
        id: spoofed_app_id
        run: |
          set -euo pipefail
          app_id="$(python3 tools/ci/generate-spoofed-app-id.py)"
          [[ "$app_id" =~ ^[a-z]{6}\.[a-z]{6}\.[a-z]{6}$ ]] || {
            echo "::error::Generated spoofed application ID is invalid"
            exit 1
          }
          echo "application_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "Generated a per-build-job randomized package ID for the spoofed flavor."

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Download KMI-specific zkfc.ko artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          pattern: '*-zkfc-lkm'
          path: lkm-artifacts
      - name: Lay out .ko into module/lkm/<kmi>-<abidir>
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in lkm-artifacts/*-zkfc-lkm; do
            base=$(basename "$d")
            arch=${base%%-*}
            rest=${base#*-}; kmi=${rest%-zkfc-lkm}
            case "$arch" in
              aarch64) abidir=arm64 ;;
              x86_64)  abidir=x86_64 ;;
              *) echo "unknown arch '$arch' in $base"; continue ;;
            esac
            ko=$(find "$d" -name '*_zkfc.ko' | head -1)
            [ -f "$ko" ] || { echo "no .ko in $d"; continue; }
            mkdir -p "module/lkm/$kmi-$abidir"
            cp "$ko" "module/lkm/$kmi-$abidir/zkfc.ko"
          done
          test -n "$(find module/lkm -name 'zkfc.ko' -print -quit)"
      - name: Stage KMI-specific LKM assets in the manager APK
        run: tools/bootpatch/stage-module-assets.sh module
      - name: Build boot-patch backend
        uses: ./.github/actions/build-bootpatch
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Validate release signing secrets
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ZK_KEYSTORE_BASE64 ZK_KEYSTORE_PASSWORD ZK_KEY_ALIAS ZK_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/zairenkai-signing"
          printf '%s' "$ZK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zairenkai-signing/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/zairenkai-signing/release.p12" \
            -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null
          keytool -certreq -alias "$ZK_KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/zairenkai-signing/release.p12" \
            -storepass:env ZK_KEYSTORE_PASSWORD -keypass:env ZK_KEY_PASSWORD \
            -file "$RUNNER_TEMP/zairenkai-signing/release-check.csr" >/dev/null
          echo "Release keystore, alias, and key credentials are valid."

      - name: Build and verify signed APK
        env:
          ZK_KEYSTORE_BASE64: ${{ secrets.ZK_KEYSTORE_BASE64 }}
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStandardRelease :app:assembleSpoofedRelease :app:testStandardDebugUnitTest "-PspoofedAppId=${{ steps.spoofed_app_id.outputs.application_id }}" --stacktrace

      - name: Enforce v1/v2/v3 signing and verify release APK
        env:
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/standard/release -name '*.apk' -type f -print -quit)"
          [[ -n "$APK" && -f "$APK" ]] || { echo "::error::Release APK not found"; exit 1; }
          BT="$ANDROID_HOME/build-tools/37.0.0"
          KEYSTORE="app/build/zk-release.jks"
          [[ -x "$BT/apksigner" ]] || { echo "::error::apksigner not found"; exit 1; }
          [[ -f "$KEYSTORE" ]] || { echo "::error::Release keystore was not materialized"; exit 1; }
          # Explicitly sign all required schemes instead of weakening verification.
          APKSIGNER="${APKSIGNER:-$BT/apksigner}"
          [[ -x "$APKSIGNER" ]] || { echo "::error::apksigner not found: $APKSIGNER"; exit 1; }
          if keytool -list -storetype PKCS12 -keystore "$KEYSTORE" \
              -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null 2>&1; then
            KS_TYPE=PKCS12
          elif keytool -list -storetype JKS -keystore "$KEYSTORE" \
              -storepass:env ZK_KEYSTORE_PASSWORD -alias "$ZK_KEY_ALIAS" >/dev/null 2>&1; then
            KS_TYPE=JKS
          else
            echo "::error::Release keystore cannot be opened as PKCS12 or JKS"
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type "$KS_TYPE" \
            --ks-key-alias "$ZK_KEY_ALIAS" \
            --ks-pass env:ZK_KEYSTORE_PASSWORD \
            --key-pass env:ZK_KEY_PASSWORD \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"

          VERIFY_OUTPUT="$("$BT/apksigner" verify --verbose --min-sdk-version 23 "$APK" 2>&1)" || {
            printf '%s\n' "$VERIFY_OUTPUT"
            exit 1
          }
          printf '%s\n' "$VERIFY_OUTPUT"
          for scheme in \
            'Verified using v1 scheme (JAR signing): true' \
            'Verified using v2 scheme (APK Signature Scheme v2): true' \
            'Verified using v3 scheme (APK Signature Scheme v3): true'; do
            grep -Fq "$scheme" <<< "$VERIFY_OUTPUT" || {
              echo "::error::Required APK signature scheme is missing: $scheme"
              exit 1
            }
          done
          EXPECTED="$(keytool -exportcert -alias "$ZK_KEY_ALIAS" -keystore "$KEYSTORE" \
            -storepass:env ZK_KEYSTORE_PASSWORD | sha256sum | awk '{print toupper($1)}')"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)" || {
            printf '%s\n' "$CERT_OUTPUT"
            echo "::error::Could not inspect APK signing certificate"
            exit 1
          }
          ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" |
            awk '/certificate SHA-256 digest:/ {
              sub(/^.*certificate SHA-256 digest:[[:space:]]*/, "")
              gsub(/[^[:xdigit:]]/, "")
              if (length($0) == 64) { print toupper($0); exit }
            }')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::APK signer does not match release keystore"
            echo "Keystore SHA-256: $EXPECTED"
            echo "APK SHA-256:      $ACTUAL"
            exit 1
          }
          echo "APK signature schemes v1/v2/v3 and keystore fingerprint verified."

      - name: Sign and verify spoofed release APK
        env:
          ZK_KEYSTORE_PASSWORD: ${{ secrets.ZK_KEYSTORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/spoofed/release -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" && -f "$APK" ]] || { echo "::error::Spoofed release APK not found"; exit 1; }
          tools/ci/verify-release-apk.sh "$APK" app/build/zk-release.jks

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.99.0
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.99.0
      - name: Build zperfd and validate workspace
        working-directory: rust
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android31-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android31-clang"
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            target="${t%%:*}"; abi="${t##*:}"
            cargo build -p zperfd --release --target "$target" --locked
            mkdir -p "../module/bin/$abi"
            cp "target/$target/release/zperfd" "../module/bin/$abi/zperfd"
            "$TC/llvm-strip" "../module/bin/$abi/zperfd"
          done

      - name: Build zkfctl userspace
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            triple="${t%%:*}"; abi="${t##*:}"
            mkdir -p "module/bin/$abi"
            "$TC/${triple}31-clang" -std=c11 -O2 -Wall -Wextra -Werror \
              -fstack-protector-strong -fPIE -pie \
              -I kernel/include/uapi -I userspace/include -I userspace/lib \
              userspace/lib/*.c userspace/zkfctl/main.c -o "module/bin/$abi/zkfctl"
            "$TC/llvm-strip" "module/bin/$abi/zkfctl"
          done

      - name: Stage zperf catalog
        run: |
          set -euo pipefail
          mkdir -p module/zperf/catalog
          cp rust/zperfd/profiles/*.toml module/zperf/catalog/

      - name: Package module + checksum manifest
        run: |
          set -euo pipefail
          test -n "$(find module/lkm -name 'zkfc.ko' -print -quit)"
          : > module/SHA256SUMS
          (cd module && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > module/SHA256SUMS
          cd module
          zip -r9 ../Zairenkai-module.zip . -x '*.git*'
          cd ..
          sha256sum Zairenkai-module.zip

      - name: Stage spoofed release APK
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/spoofed/release -type f -name '*.apk' -print -quit)"
          [[ -n "$SRC" && -f "$SRC" ]] || { echo "::error::Spoofed release APK not found"; exit 1; }
          cp "$SRC" Zairenkai-spoofed-release.apk
          unzip -t Zairenkai-spoofed-release.apk >/dev/null
          sha256sum Zairenkai-spoofed-release.apk > Zairenkai-spoofed-release.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            Zairenkai-module.zip
            app/build/outputs/apk/standard/release/*.apk
            Zairenkai-spoofed-release.apk
            Zairenkai-spoofed-release.apk.sha256
            module/SHA256SUMS
          generate_release_notes: true
