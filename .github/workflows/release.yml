name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build app (debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build userspace (arm64 + x86_64)
        run: |
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            triple="${t%%:*}"; abi="${t##*:}"
            mkdir -p module/bin/$abi
            "$TC/${triple}31-clang" -std=c11 -O2 -fstack-protector-strong -fPIE -pie \
              -I kernel/include/uapi -I userspace/include -I userspace/lib \
              userspace/lib/*.c userspace/zkfctl/main.c -o module/bin/$abi/zkfctl
            "$TC/llvm-strip" module/bin/$abi/zkfctl
          done

      - name: Package module zip
        run: |
          cd module && zip -r9 ../Zairenkai-module.zip . -x '*.git*' && cd ..

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Zairenkai-module.zip
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
