# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "zkbootpatch"
version = "0.5.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Zairenkai standalone Android boot image patcher"

[[bin]]
name = "zkbootpatch"
path = "src/main.rs"

[[bin]]
name = "zkinit"
path = "src/bin/zkinit.rs"
test = false
bench = false

[dependencies]
anyhow = "1"
regex-lite = "0.1"
rustix = { git = "https://github.com/KernelSU2/rustix.git", rev = "4a53fbc7cb7a07cabe87125cc21dbc27db316259", features = ["fs", "runtime", "system"] }
android-bootimg = { git = "https://github.com/5ec1cff/android_bootimg", rev = "150425b027c76ea104c82e408571651f2181b2c2" }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "z"
